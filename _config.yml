title: "NSDG · IIT Guwahati"
group_name: "Nanoelectronics and Semiconductor Devices Group"
short_name: "NSDG"
tagline: "Energy harvesting, Light emission and Memories"
description: "The Nanoelectronics and Semiconductor Devices Group (NSDG) at IIT Guwahati conducts research on perovskite memristors, lead-free solar cells, perovskite LEDs, defect spectroscopy and nanowire devices."
url: "https://nsdg-iitg.github.io"
baseurl: ""
lang: en
timezone: Asia/Kolkata

institute: "Indian Institute of Technology Guwahati"
department: "Department of Electronics and Electrical Engineering and Centre for Nanotechnology"
address: "Department of EEE, IIT Guwahati, Guwahati 781039, Assam, India"
contact_email: "aruntej@iitg.ac.in"
contact_phone: "+91 361 258 3469"

# Visitor statistics (optional, free). Create a site at https://www.goatcounter.com,
# then put its code here, e.g. goatcounter: "nsdg-iitg". Leave empty to switch off.
goatcounter: "nsdg-iitg"

# Address that receives requests for access to the CEISIM simulator (the form on /ceisim/)
ceisim_email: "basit@iitg.ac.in"

# Chat assistant (optional). Address of the Cloudflare Worker described in chatbot/README.md,
# e.g. chat_endpoint: "https://nsdg-chat.example.workers.dev". Leave empty to switch off.
chat_endpoint: "https://nsdg-chat.nsdg-iitg.workers.dev/"

collections:
  people:
    output: true
    permalink: /people/:name/
  research:
    output: true
    permalink: /research/:name/

defaults:
  - scope: { path: "", type: people }
    values: { layout: person, image: false }
  - scope: { path: "", type: research }
    values: { layout: area }
  - scope: { path: "" }
    values:
      layout: page
      # Picture shown when a page is shared on WhatsApp, LinkedIn, X etc.
      # Member pages use the member's own photo instead (see _includes/head.html).
      image:
        path: /assets/img/share-card.jpg
        width: 1200
        height: 630
        alt: "Nanoelectronics and Semiconductor Devices Group, IIT Guwahati"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: ["apos", "apos", "quot", "quot"]

exclude:
  - chatbot
  - README.md
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - vendor
