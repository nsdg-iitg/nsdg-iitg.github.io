<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fermi</title>
<meta name="description" content="Publication-ready band diagrams and device cross-sections for semiconductor and materials research, computed from material parameters.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#F3F5F4; --panel:#FFFFFF; --panel-2:#EEF1F0; --panel-3:#E4E9E7;
  --ink:#14201E; --ink-2:#4B5A57; --ink-3:#7B8A86;
  --line:#D5DCD9; --line-2:#E6EBE9;
  --accent:#1F6F8B; --accent-ink:#FFFFFF; --accent-soft:#E3F0F5; --accent-line:#8FBFD0;
  --warn:#A9611B; --warn-soft:#FBF0E3; --good:#2A7A4B; --crit:#B3372F; --crit-soft:#F8E6E4;
  --shadow:0 1px 2px rgba(20,32,30,.08),0 8px 24px rgba(20,32,30,.08);
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --radius:4px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121817; --panel:#1A2120; --panel-2:#222B29; --panel-3:#2A3533;
    --ink:#E6ECEA; --ink-2:#A9B6B2; --ink-3:#7E8C88;
    --line:#2C3836; --line-2:#243030;
    --accent:#5EB4CF; --accent-ink:#0E1A1F; --accent-soft:#1A3038; --accent-line:#2F6B7D;
    --warn:#E0A264; --warn-soft:#2E2418; --good:#6CC08E; --crit:#E07A72; --crit-soft:#3A2220;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121817; --panel:#1A2120; --panel-2:#222B29; --panel-3:#2A3533;
  --ink:#E6ECEA; --ink-2:#A9B6B2; --ink-3:#7E8C88;
  --line:#2C3836; --line-2:#243030;
  --accent:#5EB4CF; --accent-ink:#0E1A1F; --accent-soft:#1A3038; --accent-line:#2F6B7D;
  --warn:#E0A264; --warn-soft:#2E2418; --good:#6CC08E; --crit:#E07A72; --crit-soft:#3A2220;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:11.5px}
hr{border:0;border-top:1px solid var(--line);margin:10px 0}
kbd{font:11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--panel-2)}
a{color:var(--accent)}

/* ---------- app frame ---------- */
#app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:46px minmax(0,1fr);height:100%}
header{display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.wordmark{display:flex;align-items:baseline;gap:8px;min-width:140px}
.wordmark .name{font-size:19px;font-weight:600;letter-spacing:-.01em}
.wordmark .ef{position:relative;display:inline-block;width:26px;height:14px;vertical-align:middle}
.wordmark .ef:before{content:"";position:absolute;left:0;right:0;top:7px;border-top:1.5px dashed var(--accent)}
.wordmark .ef:after{content:"E";position:absolute;right:-9px;top:-5px;font-size:9px;font-style:italic;color:var(--accent)}
.wordmark .tag{font-size:11.5px;color:var(--ink-3)}
header .grow{flex:1}
.hbtn{background:transparent;border:1px solid transparent;border-radius:var(--radius);padding:5px 9px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.hbtn:hover{background:var(--panel-2);color:var(--ink)}
.hbtn:disabled{opacity:.4;cursor:default}
.hbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hbtn.primary:hover{filter:brightness(1.08)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.seg button{background:var(--panel);border:0;padding:5px 10px;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button{white-space:nowrap}
#figSeg{flex:none}
#profSel{max-width:210px;min-width:0}
#solverStatus{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
select.hsel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:5px 8px;max-width:260px}

main{display:grid;grid-template-columns:330px minmax(0,1fr) 312px;min-height:0}
.pane{min-height:0;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line)}
.pane:last-child{border-right:0;border-left:1px solid var(--line)}
.pane-tabs{display:flex;border-bottom:1px solid var(--line);padding:0 6px;gap:2px;flex:none}
.pane-tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:9px 10px 7px;color:var(--ink-3);font-weight:500;letter-spacing:.01em}
.pane-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane-body{overflow:auto;padding:12px 14px 40px;flex:1;min-height:0}
.pane-body[hidden]{display:none}

/* ---------- center ---------- */
.center{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;background:var(--bg)}
.fig-toolbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.fig-toolbar .grow{flex:1}
.preview{position:relative;overflow:hidden;background:#fff}
.preview.dragging{cursor:grabbing}
.preview.rot{cursor:move;touch-action:none}
.preview .note:empty{display:none}
.preview .stage{position:absolute;left:0;top:0;transform-origin:0 0}
.preview .stage svg{display:block}
.preview .note{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--ink-3);background:var(--panel);padding:3px 8px;border-radius:3px;border:1px solid var(--line);pointer-events:none;max-width:calc(100% - 24px)}
.navbtn{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:54px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:var(--radius);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);z-index:3;padding:0}
.navbtn:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.navbtn[hidden]{display:none}
.navbtn.prev{left:10px}.navbtn.next{right:10px}
.figbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:11.5px;color:var(--ink-2);z-index:3;white-space:nowrap;max-width:calc(100% - 24px)}
.figbar[hidden]{display:none}
.figbar .dots{display:flex;gap:5px}
.figbar .dots button{width:7px;height:7px;border-radius:50%;border:0;padding:0;background:var(--line)}
.figbar .dots button[aria-current="true"]{background:var(--accent)}
.readouts{border-top:1px solid var(--line);background:var(--panel);padding:8px 12px;display:flex;gap:8px;overflow-x:auto;min-height:62px;align-items:stretch}
.ro{flex:none;border:1px solid var(--line);border-radius:var(--radius);padding:6px 10px;min-width:150px;background:var(--panel);cursor:pointer;text-align:left}
.ro:hover{border-color:var(--accent-line)}
.ro .k{font-size:11px;color:var(--ink-3);letter-spacing:.01em;white-space:nowrap;font-family:var(--mono)}
.ro .v{font:500 14px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.ro .v small{font-size:11px;color:var(--ink-3);font-weight:400}
.ro.warn{border-color:var(--warn);background:var(--warn-soft)}
.ro .f{display:none;margin-top:5px;font:11px/1.4 var(--mono);color:var(--ink-2);white-space:pre-wrap;max-width:360px}
.ro[aria-expanded="true"] .f{display:block}
.ro[aria-expanded="true"]{min-width:260px}

/* ---------- forms ---------- */
.field{display:grid;grid-template-columns:118px 1fr;align-items:center;gap:8px;margin:6px 0}
.field label{color:var(--ink-2);font-size:12px}
.field input[type=text],.field input[type=number],.field select,.field textarea,.inp{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:5px 7px;min-width:0}
.field input[type=number],.inp.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.field .row{display:flex;gap:6px;align-items:center}
.field .row input{flex:1}
.check{display:flex;align-items:center;gap:8px;margin:5px 0;color:var(--ink-2);font-size:12.5px}
.check input{accent-color:var(--accent);margin:0}
.sec{margin:14px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.sec:after{content:"";flex:1;border-top:1px solid var(--line)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:6px 10px;color:var(--ink)}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 7px;font-size:12px}
.btn.icon{padding:3px 6px;min-width:26px;text-align:center}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.btnrow .btn{flex:1 1 auto}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 10px;border-radius:0 var(--radius) var(--radius) 0;font-size:12px;color:var(--ink-2);margin:10px 0}
.callout.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.callout.good{border-left-color:var(--good)}
textarea.code{font:11.5px/1.4 var(--mono);width:100%;min-height:90px;resize:vertical;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:6px}

/* ---------- stack editor ---------- */
.stack-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.stack-hdr .grow{flex:1}
.layer{border:1px solid var(--line);border-radius:var(--radius);margin:6px 0;background:var(--panel);transition:border-color .12s}
.layer.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.layer .top{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 8px 6px}
.layer .swatch{width:10px;height:38px;border-radius:2px;border:1px solid rgba(0,0,0,.15)}
.layer .mat{display:flex;flex-direction:column;gap:5px;min-width:0}
.layer .mat select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:4px 6px}
.layer .mat .props{display:flex;gap:5px;align-items:center}
.layer .mat .props input,.layer .mat .props select{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:3px 5px;font-family:var(--mono);font-size:12px;min-width:0}
.layer .mat .props input.t{width:64px}
.layer .mat .props select.unit{width:52px;font-family:var(--sans)}
.layer .mat .props select.dop{width:44px;font-family:var(--sans)}
.layer .mat .props input.N{flex:1;min-width:70px}
.layer .ctl{display:flex;flex-direction:column;gap:2px}
.layer .ctl button{background:transparent;border:1px solid transparent;border-radius:3px;color:var(--ink-3);padding:0 5px;line-height:17px;font-size:12px}
.layer .ctl button:hover{background:var(--panel-2);color:var(--ink)}
.layer .ctl button:disabled{opacity:.3}
.layer .more{border-top:1px dashed var(--line);padding:6px 8px 8px;background:var(--panel-2);display:none}
.layer.open .more{display:block}
.layer .more .field{grid-template-columns:72px 1fr auto;margin:4px 0}
.layer .more .field input{font-family:var(--mono)}
.layer .more .src{font-size:11px;color:var(--ink-3);margin-top:4px}
.layer .idx{font:11px var(--mono);color:var(--ink-3)}
.layer .kindtag{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.layer .warnline{font-size:11px;color:var(--warn);padding:0 8px 6px}
.interface{display:flex;align-items:center;gap:6px;font:11px var(--mono);color:var(--ink-3);padding:0 8px;height:14px}
.interface:before,.interface:after{content:"";flex:1;border-top:1px dotted var(--line)}
.dropzone{height:4px}

/* ---------- materials ---------- */
.matgrid{display:flex;flex-direction:column;gap:4px}
.matrow{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;padding:5px 6px;border:1px solid var(--line);border-radius:var(--radius)}
.matrow .sw{width:10px;height:22px;border-radius:2px;border:1px solid rgba(0,0,0,.15)}
.matrow .nm{font-weight:500}
.matrow .pp{font:11px var(--mono);color:var(--ink-3)}
.matrow .acts{display:flex;gap:3px}
.matform{border:1px solid var(--accent-line);border-radius:var(--radius);padding:8px;margin:8px 0;background:var(--accent-soft)}
.matform .field{grid-template-columns:70px 1fr;margin:4px 0}

/* ---------- simulate ---------- */
.callout.crit{border-left-color:var(--crit);background:var(--crit-soft)}
.simtab{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.simtab th,.simtab td{border-bottom:1px solid var(--line);padding:3px 5px;text-align:right;font-family:var(--mono);font-size:11px}
.simtab th:first-child,.simtab td:first-child{text-align:left;font-family:var(--sans)}
.simtab th{color:var(--ink-3);font-weight:500}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(10,16,15,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal[open]{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:6px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:18px 22px;box-shadow:var(--shadow)}
.modal .box h2{font-size:16px;margin-bottom:8px}
.modal .box h3{font-size:13px;margin:14px 0 4px}
.modal .box ol,.modal .box ul{padding-left:20px;margin:4px 0}
.layer .more details{margin-top:6px}
.layer .more summary{cursor:pointer;font-size:11.5px;color:var(--ink-2);padding:3px 0}
.modal .box p,.modal .box li{font-size:12.5px;color:var(--ink-2);max-width:64ch}
.modal .box code{font:11.5px var(--mono);background:var(--panel-2);padding:0 4px;border-radius:3px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:4px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90vw}
.toast.show{opacity:1}

/* ---------- mobile ---------- */
.mobile-nav{display:none}
@media (max-width:960px){
  #app{grid-template-rows:46px minmax(0,1fr) 44px}
  main{grid-template-columns:minmax(0,1fr)}
  .center{min-width:0}
  .fig-toolbar{flex-wrap:wrap;gap:6px}
  #solverStatus{display:none}
  .seg button{white-space:nowrap;padding:5px 8px}
  .pane{display:none;border:0}
  .pane[data-active="true"]{display:flex}
  .center{display:none}
  .center[data-active="true"]{display:grid}
  .mobile-nav{display:flex;border-top:1px solid var(--line);background:var(--panel)}
  .mobile-nav button{flex:1;background:transparent;border:0;padding:10px;color:var(--ink-3);font-weight:500}
  .mobile-nav button[aria-pressed="true"]{color:var(--accent);box-shadow:inset 0 2px 0 var(--accent)}
  header .hide-m{display:none}
  header{gap:8px;padding:0 10px}
  .wordmark{min-width:0}
  select.hsel{flex:1;min-width:0;max-width:none}
  .layer .mat .props{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="wordmark"><span class="name">Fermi</span><span class="ef" aria-hidden="true"></span><span class="tag hide-m">band diagrams &amp; device figures</span></div>
  <select id="templateSel" class="hsel" aria-label="Load a template" title="Load a template stack"></select>
  <div class="grow"></div>
  <button class="hbtn" id="undoBtn" title="Undo (Ctrl/Cmd+Z)" aria-label="Undo">&#8630;</button>
  <button class="hbtn" id="redoBtn" title="Redo (Ctrl/Cmd+Shift+Z)" aria-label="Redo">&#8631;</button>
  <button class="hbtn hide-m" id="helpBtn" title="Physics model and assumptions">Assumptions</button>
  <button class="hbtn" id="guideBtn" title="How to use Fermi">Help</button>
  <button class="hbtn" id="themeBtn" title="Toggle interface theme" aria-label="Toggle interface theme">&#9680;</button>
</header>
<main>
  <!-- LEFT -->
  <section class="pane" id="paneLeft" data-active="true" aria-label="Stack and materials">
    <div class="pane-tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="stack">Stack</button>
      <button role="tab" aria-selected="false" data-tab="materials">Materials</button>
    </div>
    <div class="pane-body" id="tab-stack">
      <div class="stack-hdr">
        <span class="muted small">Layers, left &rarr; right</span><span class="grow"></span>
        <button class="btn sm" id="addLayerBtn">+ Add layer</button>
      </div>
      <div id="layers"></div>
      <div class="callout small" id="stackHint"></div>
    </div>
    <div class="pane-body" id="tab-materials" hidden>
      <div class="stack-hdr">
        <span class="muted small">300 K parameters, with sources</span><span class="grow"></span>
        <button class="btn sm" id="addMatBtn">+ Custom</button>
      </div>
      <div id="matform"></div>
      <div id="matlist" class="matgrid"></div>
      <div class="btnrow"><button class="btn sm" id="resetMatsBtn">Reset library to defaults</button></div>
    </div>
  </section>

  <!-- CENTER -->
  <section class="center" id="paneCenter" data-active="false" aria-label="Figure preview">
    <div class="fig-toolbar">
      <div class="seg" id="figSeg" role="group" aria-label="Figure">
        <button data-fig="band" aria-pressed="true">Band diagram</button>
        <button data-fig="xsec" aria-pressed="false">Cross-section</button>
        <button data-fig="d3" aria-pressed="false">3D</button>
        <button data-fig="prof" aria-pressed="false">Spatial profiles</button>
      </div>
      <div class="grow"></div>
      <select id="profSel" class="hsel" aria-label="Quantity to plot" title="Quantity to plot" hidden></select>
      <div class="grow"></div>
      <span class="muted small" id="solverStatus"></span>
    </div>
    <div class="preview" id="preview">
      <div class="stage" id="stage"></div>
      <button class="navbtn prev" id="figPrev" title="Previous plot (left arrow key)" aria-label="Previous plot" hidden>&#8249;</button>
      <button class="navbtn next" id="figNext" title="Next plot (right arrow key)" aria-label="Next plot" hidden>&#8250;</button>
      <div class="figbar" id="figBar" hidden></div>
      <div class="note" id="previewNote"></div>
    </div>
    <div class="readouts" id="readouts"></div>
  </section>

  <!-- RIGHT -->
  <section class="pane" id="paneRight" data-active="false" aria-label="Figure settings and export">
    <div class="pane-tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="figure">Figure</button>
      <button role="tab" aria-selected="false" data-tab="export">Export</button>
    </div>
    <div class="pane-body" id="tab-figure"></div>
    <div class="pane-body" id="tab-export" hidden></div>
  </section>
</main>
<nav class="mobile-nav" aria-label="Sections">
  <button data-pane="paneLeft" aria-pressed="true">Stack</button>
  <button data-pane="paneCenter" aria-pressed="false">Figure</button>
  <button data-pane="paneRight" aria-pressed="false">Settings</button>
</nav>
</div>
<div class="modal" id="helpModal" role="dialog" aria-modal="true" aria-labelledby="helpTitle"><div class="box" id="helpBox"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script id="fermi-physics">
'use strict';
/* =====================================================================
   FERMI — material library and physics core
   Units: energies in eV, lengths in cm inside the solver (nm in the UI),
   densities in cm^-3, permittivity in F/cm, temperature in K.
   ===================================================================== */
const Q = 1.602176634e-19, KB = 8.617333262e-5, EPS0 = 8.8541878128e-14;

/* ---- validated categorical palette (light surface) used for layer identity ---- */
const PAL = { blue:'#2a78d6', orange:'#eb6834', aqua:'#1baf7a', yellow:'#eda100', magenta:'#e87ba4',
  green:'#008300', violet:'#4a3aa7', red:'#e34948', blue600:'#184f95', blue200:'#9ec5f4', blue100:'#cde2fb',
  blue150:'#b7d3f6', metal:'#3d3d3d', metal2:'#6a6a6a', ins:'#ececec', glass:'#f4f6f8', tco:'#d6ecf0' };

/* ---------------- resolved layer parameters ---------------- */
function bulkFermi(r){
  const kT = r.kT;
  const ni = Math.sqrt(r.Nc*r.Nv)*Math.exp(-r.Eg/(2*kT));
  const N = (r.dop==='n'?r.N:0) - (r.dop==='p'?r.N:0);
  let n,p;
  if (N>=0){ n = N/2 + Math.sqrt(N*N/4+ni*ni); p = ni*ni/n; } else { p = -N/2 + Math.sqrt(N*N/4+ni*ni); n = ni*ni/p; }
  const EcEF = kT*Math.log(r.Nc/n), EFEv = kT*Math.log(r.Nv/p);
  const Nmaj = Math.max(n,p,1e8);
  return { ni, n0:n, p0:p, EcEF, EFEv, degenerate: (EcEF < kT*Math.log(2)) || (EFEv < kT*Math.log(2)),
           LD: Math.sqrt(r.eps*kT/(Q*Nmaj)), phiF: kT*Math.log(Nmaj/ni) };
}

function resolveLayer(L, T, mats){
  const m = mats[L.mat] || MATERIAL_LIBRARY.Si;
  const kT = KB*T, o = L.ov || {};
  let base = m;
  if (m.fn){ const x = (L.x!=null? L.x : m.x); base = Object.assign({}, m, m.fn(x), {x}); }
  const r = { id:L.id, mat:L.mat, name:(L.label||base.name), kind:base.kind, color:L.color||base.color, hatch:L.hatch||base.hatch,
    t: (L.t_nm||0)*1e-7, t_nm:L.t_nm||0, kT, T,
    chi:o.chi??base.chi, Eg:o.Eg??base.Eg, epsr:o.epsr??base.epsr, phi:o.phi??base.phi,
    Nc:(o.Nc??base.Nc)*Math.pow(T/300,1.5), Nv:(o.Nv??base.Nv)*Math.pow(T/300,1.5),
    dop:(base.kind==='semi' ? (L.dop||'i') : 'i'), N:(L.N||0), x:base.x, overridden:Object.keys(o).length>0 };
  r.eps = (r.epsr||1)*EPS0;
  if (r.kind==='semi'){ Object.assign(r, bulkFermi(r)); r.phi = r.chi + r.EcEF; }
  if (r.kind==='ins'){ r.phi = NaN; }
  return r;
}

/* ---------------- terminals and quasi-Fermi levels ---------------- */
function assignTerminals(R, V, biasTerm){
  const EFL = biasTerm==='left' ? -V : 0, EFR = biasTerm==='right' ? -V : 0;
  const n = R.length;
  // locate a p-n change, or (single doped type) put the junction next to the doped layer(s)
  let j=-1, firstType=null, firstDoped=-1, lastDoped=-1;
  for (let i=0;i<n;i++){ const r=R[i]; if (r.kind!=='semi' || r.dop==='i') continue;
    if (firstDoped<0) firstDoped=i; lastDoped=i;
    if (firstType && r.dop!==firstType && j<0){ j=i; } if(!firstType) firstType=r.dop; }
  let nGroup=null;
  if (j>=0){ nGroup = firstType==='n' ? 'L' : 'R'; }
  else if (firstDoped>=0){
    const nearRight = firstDoped > (n-1-lastDoped);
    if (nearRight){ j = firstDoped; nGroup = firstType==='n' ? 'R' : 'L'; }
    else { j = lastDoped+1; nGroup = firstType==='n' ? 'L' : 'R'; }
  }
  const hasPN = j>0 && j<n && R.slice(0,j).some(r=>r.kind==='semi') && R.slice(j).some(r=>r.kind==='semi');
  let defaultGroup='L';
  if (!hasPN){ const lm=R[0].kind==='metal', rm=R[n-1].kind==='metal'; if (lm && !rm) defaultGroup='R'; }
  R.forEach((r,i)=>{
    r.group = hasPN ? (i<j?'L':'R') : defaultGroup;
    if (r.kind==='metal'){ r.group = (i===0)?'L' : (i===n-1 ? 'R' : r.group); }
    r.EFt = r.group==='L' ? EFL : EFR;
    if (r.kind!=='semi') return;
    const own=r.EFt, other = r.group==='L'?EFR:EFL;
    if (!hasPN){ r.EFn=own; r.EFp=own; return; }
    if (r.dop==='n'){ r.EFn=own; r.EFp=other; }
    else if (r.dop==='p'){ r.EFp=own; r.EFn=other; }
    else { r.EFn = nGroup==='L'?EFL:EFR; r.EFp = nGroup==='L'?EFR:EFL; }
  });
  return { EFL, EFR, hasPN, nGroup, pnIndex:j, firstType };
}

/* ---------------- grid ---------------- */
function domainThickness(R, i, V){
  const r = R[i]; if (r.kind==='metal') return 0;
  if (r.kind==='ins') return Math.min(r.t, 2e-4);
  const nb = (k)=>{ let m=k; while (m>=0 && m<R.length && R[m].kind==='ins') m += (k>i?1:-1); return (m>=0&&m<R.length)?R[m]:null; };
  let dPhi = 0;
  for (const n of [nb(i-1), nb(i+1)]) if (n && isFinite(n.phi)) dPhi = Math.max(dPhi, Math.abs(r.phi-n.phi));
  dPhi += Math.abs(V) + 0.5;
  const Nmaj = Math.max(r.n0, r.p0, 1e12);
  const West = Math.sqrt(2*r.eps*dPhi/(Q*Nmaj));
  let cap = Math.max(4*West + 10*r.LD, 3e-5);   // layers up to a few hundred nm (transport layers) are always drawn in full
  cap = Math.min(cap, 2e-3);
  const t = r.t>0 ? r.t : Infinity;
  return t > 1.5*cap ? cap : t;
}

function buildGrid(R, V, schematic){
  const nodes = []; let pos = 0;
  const cluster = s => s - 0.85*Math.sin(2*Math.PI*s)/(2*Math.PI);
  R.forEach((r,i)=>{
    r.x0 = pos;
    if (r.kind==='metal'){
      const psiD = -(r.EFt + r.phi);
      if (!schematic && nodes.length && Math.abs(nodes[nodes.length-1].x-pos)<1e-12){ const nd=nodes[nodes.length-1]; nd.dir=psiD; nd.R=i; }
      else nodes.push({x:pos, L:i, R:i, dir:psiD});
      r.tdom = 0; r.x1 = pos; r.nodeStart = nodes.length-1; r.nodeEnd = nodes.length-1; return;
    }
    const tdom = domainThickness(R, i, V); r.tdom = tdom; r.truncated = tdom < r.t*0.999;
    const n = r.kind==='ins' ? 60 : 320;
    let k0 = 0;
    if (!schematic && nodes.length && Math.abs(nodes[nodes.length-1].x-pos)<1e-12){ nodes[nodes.length-1].R = i; k0 = 1; r.nodeStart = nodes.length-1; }
    else r.nodeStart = nodes.length;
    for (let k=k0;k<=n;k++){ const s=k/n; nodes.push({x:pos+tdom*cluster(s), L:i, R:i, dir:null}); }
    r.nodeEnd = nodes.length-1;
    pos += tdom; r.x1 = pos;
  });
  return nodes;
}

/* ---------------- Poisson–Boltzmann solver (equilibrium per terminal, fixed quasi-Fermi levels) ---------------- */
function chargeAt(r, psi){
  if (!r || r.kind!=='semi') return [0,0];
  const kT=r.kT;
  const a1 = Math.min((r.EFn + psi + r.chi)/kT, 300), a2 = Math.min((-psi - r.chi - r.Eg - r.EFp)/kT, 300);
  const n = r.Nc*Math.exp(a1), p = r.Nv*Math.exp(a2);
  const Nd = r.dop==='n'?r.N:0, Na = r.dop==='p'?r.N:0;
  return [Q*(p-n+Nd-Na), -Q*(n+p)/kT];
}
function solvePoisson(R, nodes){
  const n = nodes.length; const psi = new Float64Array(n);
  // initial guess: bulk alignment of each node's layer, insulators interpolated
  for (let i=0;i<n;i++){ const nd=nodes[i]; if (nd.dir!=null){ psi[i]=nd.dir; continue; }
    const r = R[nd.R]; if (r.kind==='semi') psi[i] = -((r.EFn+r.EFp)/2 + r.phi); else psi[i]=NaN; }
  for (let i=0;i<n;i++) if (Number.isNaN(psi[i])){ let a=i-1, b=i+1; while(a>=0&&Number.isNaN(psi[a])) a--; while(b<n&&Number.isNaN(psi[b])) b++;
    const va = a>=0?psi[a]:(b<n?psi[b]:0), vb = b<n?psi[b]:va; const xa=a>=0?nodes[a].x:nodes[i].x, xb=b<n?nodes[b].x:nodes[i].x;
    psi[i] = (xb>xa) ? va + (vb-va)*(nodes[i].x-xa)/(xb-xa) : va; }
  const A=new Float64Array(n), B=new Float64Array(n), C=new Float64Array(n), D=new Float64Array(n);
  let iter=0, maxd=1, converged=false;
  for (iter=0; iter<400; iter++){
    for (let i=0;i<n;i++){
      const nd=nodes[i];
      if (nd.dir!=null){ A[i]=0;B[i]=1;C[i]=0;D[i]=nd.dir-psi[i]; continue; }
      const hL = i>0 ? nd.x-nodes[i-1].x : 0, hR = i<n-1 ? nodes[i+1].x-nd.x : 0;
      const rL = R[nd.L], rR = R[nd.R];
      const eL = rL.eps, eR = rR.eps;
      let F=0, dF=0;
      if (hR>0){ F += eR*(psi[i+1]-psi[i])/hR; dF -= eR/hR; C[i]=eR/hR; } else C[i]=0;
      if (hL>0){ F -= eL*(psi[i]-psi[i-1])/hL; dF -= eL/hL; A[i]=eL/hL; } else A[i]=0;
      if (hL>0){ const [ro,dro]=chargeAt(rL,psi[i]); F += ro*hL/2; dF += dro*hL/2; }
      if (hR>0){ const [ro,dro]=chargeAt(rR,psi[i]); F += ro*hR/2; dF += dro*hR/2; }
      B[i]=dF; D[i]=-F;
    }
    // Thomas algorithm
    const cp=new Float64Array(n), dp=new Float64Array(n);
    cp[0]=C[0]/B[0]; dp[0]=D[0]/B[0];
    for (let i=1;i<n;i++){ const m=B[i]-A[i]*cp[i-1]; cp[i]=C[i]/m; dp[i]=(D[i]-A[i]*dp[i-1])/m; }
    const d=new Float64Array(n); d[n-1]=dp[n-1]; for (let i=n-2;i>=0;i--) d[i]=dp[i]-cp[i]*d[i+1];
    maxd=0; for (let i=0;i<n;i++){ let v=d[i]; if (v>0.5) v=0.5; if (v<-0.5) v=-0.5; psi[i]+=v; if (Math.abs(v)>maxd) maxd=Math.abs(v); }
    if (maxd<1e-8){ converged=true; break; }
  }
  return { psi, iterations:iter+1, converged, residual:maxd };
}

/* ---------------- full computation ---------------- */
function computeStack(project, mats){
  const S = project.stack, F = project.fig;
  const T = F.T || 300, V = F.mode==='bias' ? (F.V||0) : 0;
  const R = S.layers.map(L=>resolveLayer(L, T, mats));
  const warnings=[];
  if (!R.length) return {R, warnings:['Empty stack'], nodes:[], sol:null};
  const term = assignTerminals(R, V, F.biasTerm||'right');
  const schematic = !!F.schematic;
  const nodes = buildGrid(R, V, schematic);
  let sol;
  if (schematic){
    // flat bands aligned at the Fermi level: E_vac of each layer at its own flat-band value (steps at interfaces)
    const flat = R.map(r=>{ if (r.kind==='metal') return r.EFt + r.phi; if (r.kind==='semi') return (r.dop==='p'?r.EFp:r.EFn) + r.phi; return null; });
    R.forEach((r,i)=>{ if (flat[i]!=null) return; let j=i+1; while (j<R.length && R[j].kind==='ins') j++; let k=i-1; while (k>=0 && R[k].kind==='ins') k--;
      const right = (j<R.length && R[j].kind==='semi') ? flat[j] : null, left = (k>=0 && R[k].kind==='semi') ? flat[k] : null;
      flat[i] = right ?? left ?? (j<R.length ? flat[j] : (k>=0 ? flat[k] : 0)); });
    const psi = new Float64Array(nodes.length); nodes.forEach((nd,i)=>{ psi[i] = nd.dir!=null ? nd.dir : -flat[nd.R]; });
    sol = { psi, iterations:0, converged:true, residual:0 };
    warnings.push('Schematic mode: flat bands aligned at E_F, no band bending; depletion quantities are not computed.');
  } else {
    sol = solvePoisson(R, nodes);
    if (!sol.converged) warnings.push('Poisson solver did not fully converge (residual '+sol.residual.toExponential(1)+' V); figure is approximate.');
  }
  R.forEach(r=>{ if (r.kind==='semi' && r.degenerate) warnings.push(r.name+': degenerate doping — Boltzmann statistics overestimate the Fermi-level shift.');
                 if (r.truncated && !schematic) warnings.push(r.name+': drawn domain truncated to '+fmtLen(r.tdom)+' (quasi-neutral beyond).'); if (schematic) r.truncated=false; });
  // profiles
  const prof = nodes.map((nd,i)=>({ x:nd.x, Evac:-sol.psi[i], layer:nd.R }));
  const analysis = analyzeStack(R, nodes, sol, term, V, F);
  return { R, nodes, sol, prof, term, analysis, warnings, T, V };
}

/* ---------------- analytic readouts (depletion approximation etc.) ---------------- */
function trim0(x){ return x.includes('.') ? x.replace(/0+$/,'').replace(/\.$/,'') : x; }
function fmtLen(cm){ const nm=cm*1e7; if (nm>=1000) return trim0((nm/1000).toPrecision(3))+' µm'; return trim0(nm.toPrecision(3))+' nm'; }
function fmtE(x,d=2){ return (Math.round(x*Math.pow(10,d))/Math.pow(10,d)).toFixed(d); }
function sci(x,d=2){ if (x===0) return '0'; const e=Math.floor(Math.log10(Math.abs(x))); const m=x/Math.pow(10,e); return m.toFixed(d)+'e'+e; }

function nodeEvac(sol, k){ return -sol.psi[k]; }
function analyzeStack(R, nodes, sol, term, V, F){
  const items=[]; const kT=R[0].kT;
  const Evac = k=>-sol.psi[k];
  // bulk reference for a semiconductor layer: its far end (away from interface k side)
  // flat-band (neutral) vacuum level of a layer: majority quasi-Fermi level + work function. Exact for thick layers; for thin fully depleted layers it is the neutral reference.
  const bulkE = (r)=> (r.dop==='p' ? r.EFp : r.EFn) + r.phi;
  for (let i=0;i<R.length-1;i++){
    const A=R[i], B=R[i+1]; const kA=A.nodeEnd, kB=B.nodeStart; const Ei = Evac(kA);
    const push=(o)=>items.push(Object.assign({iface:i, pair:A.name+' / '+B.name}, o));
    // ---- metal / semiconductor ----
    const ms = (A.kind==='metal'&&B.kind==='semi') ? {m:A,s:B,sideBulk:'far-right'} : (A.kind==='semi'&&B.kind==='metal') ? {m:B,s:A,sideBulk:'far-left'} : null;
    if (ms){
      const {m,s}=ms; const ntype = s.dop!=='p';
      const phiB = ntype ? m.phi - s.chi : s.chi + s.Eg - m.phi;
      const Vbi = ntype ? phiB - s.EcEF : phiB - s.EFEv;
      const Eb = bulkE(s); const bend = Ei - Eb;            // E_vac(interface) − E_vac(bulk), eV
      const depl = !F.schematic && (ntype ? bend > 0 : bend < 0);          // n: bands up toward interface = depletion
      const N = Math.max(s.N, 1e8);
      const psi_s = Math.abs(bend);
      const W = depl ? Math.sqrt(2*s.eps*psi_s/(Q*N)) : null; const fullDep = W && s.t>0 && W > s.t;
      const W0 = Vbi>0 ? Math.sqrt(2*s.eps*Vbi/(Q*N)) : null;
      const Emax = depl ? Math.sqrt(2*Q*N*psi_s/s.eps) : 0;
      const dphi = depl ? Math.sqrt(Q*Emax/(4*Math.PI*s.eps)) : 0;
      const xm = depl && Emax>0 ? Math.sqrt(Q/(16*Math.PI*s.eps*Emax)) : 0;
      const ohmic = Vbi <= 0;
      push({type:'schottky', m, s, ntype, phiB, Vbi, bend, psi_s, W, W0, Emax, dphi, xm, ohmic, depl, N, fullDep, intrinsic:s.dop==='i',
        rows:[
          {k:(ntype?'φ_Bn':'φ_Bp'), v:fmtE(phiB)+' eV', f:(ntype?'φ_Bn = φ_m − χ = '+fmtE(m.phi)+' − '+fmtE(s.chi):'φ_Bp = χ + E_g − φ_m = '+fmtE(s.chi)+' + '+fmtE(s.Eg)+' − '+fmtE(m.phi))+'\nSchottky–Mott limit, no Fermi-level pinning, no interface dipole.'},
          ...(s.dop==='i' ? [{k:'φ_Bp', v:fmtE(s.chi+s.Eg-m.phi)+' eV', f:'φ_Bp = χ + E_g − φ_m = '+fmtE(s.chi)+' + '+fmtE(s.Eg)+' − '+fmtE(m.phi)+' (undoped layer: both barriers shown)'}] : []),
          {k:(ntype?'E_c − E_F':'E_F − E_v'), v:fmtE(ntype?s.EcEF:s.EFEv,3)+' eV', f:(ntype?'E_c − E_F = kT ln(N_c/n₀) = '+fmtE(kT,4)+' × ln('+sci(s.Nc)+'/'+sci(s.n0)+')':'E_F − E_v = kT ln(N_v/p₀) = '+fmtE(kT,4)+' × ln('+sci(s.Nv)+'/'+sci(s.p0)+')')+'\nBoltzmann statistics, complete ionization, n₀ from charge neutrality with n_i = '+sci(s.ni)+' cm⁻³.'},
          {k:'V_bi', v:fmtE(Vbi)+' V', warn:ohmic, f:'V_bi = φ_B − (E_c − E_F)/q = '+fmtE(phiB)+' − '+fmtE(ntype?s.EcEF:s.EFEv,3)+(ohmic?'\nV_bi ≤ 0: accumulation (ohmic-type) contact; no depletion region.':'')},
          {k:'W', v:F.schematic ? '— (schematic)' : W? fmtLen(W)+(fullDep?' > t':''): (ohmic?'— (accum.)':'—'), warn:!!fullDep, f:(fullDep?'Layer fully depleted (W exceeds its thickness '+fmtLen(s.t)+'); the field is set by the whole stack.\n':'')+'W = √(2ε_s(V_bi − V)/(qN)) with ε_s = '+s.epsr+' ε₀, N = '+sci(N)+' cm⁻³, V_bi − V = '+fmtE(psi_s,3)+' V (band bending from the solver)'+(W0?'\nAt V = 0: W₀ = '+fmtLen(W0):'')+'\nDepletion approximation (abrupt edge; the drawn profile is the exact Poisson–Boltzmann solution and has a ~L_D tail).'},
          {k:'E_max', v:depl?(Emax/1e3).toPrecision(3)+' kV/cm':'—', f:'E_max = √(2qN(V_bi − V)/ε_s) = '+Emax.toPrecision(3)+' V/cm\n(Sze adds −kT/q inside the bracket; ~1–3% effect.)'},
          {k:'Δφ (image force)', v:depl?(dphi*1000).toPrecision(3)+' meV':'—', f:'Δφ = √(qE_max/(4πε_s)) = '+(dphi*1000).toPrecision(3)+' meV; x_m = √(q/(16πε_s E_max)) = '+fmtLen(xm)+'\nφ_B,eff = φ_B − Δφ = '+fmtE(phiB-dphi,3)+' eV. Static ε_s used (dynamic ε would be the strict choice).'},
        ]});
      continue;
    }
    // ---- semiconductor / semiconductor ----
    if (A.kind==='semi' && B.kind==='semi'){
      const dEc = A.chi - B.chi, dEv = (B.chi+B.Eg) - (A.chi+A.Eg);
      const Vbi = A.phi - B.phi;   // >0: E_vac rises from A to B? sign: E_vac,B,bulk − E_vac,A,bulk = φ_B − φ_A at equilibrium
      const EA = bulkE(A), EB = bulkE(B);
      const total = Math.abs(EB-EA); const bendA = Ei-EA, bendB = Ei-EB;
      const deplA = A.dop==='n' ? bendA>0 : A.dop==='p' ? bendA<0 : true;
      const deplB = B.dop==='n' ? bendB>0 : B.dop==='p' ? bendB<0 : true;
      const NA = Math.max(A.N,1e8), NB = Math.max(B.N,1e8);
      // depletion-approximation partition (heterojunction, two permittivities)
      const xA = Math.sqrt(2*A.eps*B.eps*NB*total/(Q*NA*(A.eps*NA+B.eps*NB)));
      const xB = Math.sqrt(2*A.eps*B.eps*NA*total/(Q*NB*(A.eps*NA+B.eps*NB)));
      const homo = A.mat===B.mat && Math.abs(dEc)<1e-9;
      const rows=[];
      if (!homo){
        rows.push({k:'ΔE_c', v:fmtE(Math.abs(dEc))+' eV', f:'Anderson’s rule: ΔE_c = χ_'+A.name+' − χ_'+B.name+' = '+fmtE(A.chi)+' − '+fmtE(B.chi)+' = '+fmtE(dEc)+' eV\n(E_c steps '+(dEc>0?'down':'up')+' from '+A.name+' to '+B.name+'). No interface dipole, vacuum level continuous.'});
        rows.push({k:'ΔE_v', v:fmtE(Math.abs(dEv))+' eV', f:'ΔE_v = (χ+E_g)_'+B.name+' − (χ+E_g)_'+A.name+' = '+fmtE(B.chi+B.Eg)+' − '+fmtE(A.chi+A.Eg)+' = '+fmtE(dEv)+' eV\n(E_v steps '+(dEv>0?'down':'up')+' from '+A.name+' to '+B.name+').'});
      }
      rows.push({k:'V_bi', v:fmtE(Math.abs(Vbi))+' V', f:'V_bi = |φ_'+A.name+' − φ_'+B.name+'| = |'+fmtE(A.phi,3)+' − '+fmtE(B.phi,3)+'|'+(homo?'\n= E_g − (E_c−E_F)_n − (E_F−E_v)_p = kT ln(N_a N_d / n_i²) for a homojunction':'')+'\nBand bending now: '+fmtE(total,3)+' V (= V_bi − V across this junction).'});
      if (F.schematic){ rows.push({k:'W', v:'— (schematic)', f:'Schematic mode draws flat bands; switch it off for the Poisson solution and depletion widths.'}); }
      else if (deplA && deplB){
        const fdA = A.t>0 && xA>A.t, fdB = B.t>0 && xB>B.t;
        rows.push({k:'W', v:fmtLen(xA+xB)+((fdA||fdB)?' (fully depleted)':''), warn:(fdA||fdB), f:((fdA||fdB)?((fdA?A.name:B.name)+' is thinner than its depletion width — the layer is fully depleted and the field is set by the whole stack; the depletion-approximation numbers below are nominal.\n'):'')+'Depletion approximation with N_'+A.name+' x_'+A.name+' = N_'+B.name+' x_'+B.name+':\nx_'+A.name+' = '+fmtLen(xA)+', x_'+B.name+' = '+fmtLen(xB)+'\nW = √(2ε(V_bi−V)/q · (N_a+N_d)/(N_a N_d)) for a homojunction; heterojunction uses ε_A, ε_B separately.'});
      } else {
        const acc = !deplA ? A : B;
        rows.push({k:'W', v:'accum. side: '+acc.name, warn:true, f:acc.name+' side accumulates (bending drives majority carriers toward the interface), so the depletion approximation does not apply there; profile from the exact solution (≈ a few L_D = '+fmtLen(acc.LD)+').'});
      }
      push({type:'hetero', A, B, dEc, dEv, Vbi, total, xA, xB, deplA, deplB, homo, rows});
      continue;
    }
    // ---- insulator interfaces ----
    if ((A.kind==='semi'&&B.kind==='ins') || (A.kind==='ins'&&B.kind==='semi')){
      const s = A.kind==='semi'?A:B, ins = A.kind==='ins'?A:B;
      const Phe = s.chi - ins.chi, Phh = (ins.chi+ins.Eg) - (s.chi+s.Eg);
      push({type:'semi-ins', s, ins, rows:[
        {k:'Φ_e ('+s.name+'→'+ins.name+')', v:fmtE(Phe)+' eV', f:'Electron barrier = χ_'+s.name+' − χ_'+ins.name+' = '+fmtE(s.chi)+' − '+fmtE(ins.chi)},
        {k:'Φ_h', v:fmtE(Phh)+' eV', f:'Hole barrier = (χ+E_g)_'+ins.name+' − (χ+E_g)_'+s.name+' = '+fmtE(ins.chi+ins.Eg)+' − '+fmtE(s.chi+s.Eg)}]});
      continue;
    }
    if ((A.kind==='metal'&&B.kind==='ins') || (A.kind==='ins'&&B.kind==='metal')){
      const m = A.kind==='metal'?A:B, ins = A.kind==='ins'?A:B;
      push({type:'metal-ins', m, ins, rows:[{k:'Φ_e ('+m.name+'→'+ins.name+')', v:fmtE(m.phi-ins.chi)+' eV', f:'φ_m − χ_'+ins.name+' = '+fmtE(m.phi)+' − '+fmtE(ins.chi)}]});
      continue;
    }
  }
  // ---- MOS / MIS detection: metal | ins | semi in either direction ----
  for (let i=0;i<R.length-2;i++){
    const a=R[i], b=R[i+1], c=R[i+2];
    let m=null, s=null, ins=null, gateLeft=true;
    if (a.kind==='metal'&&b.kind==='ins'&&c.kind==='semi'){ m=a; ins=b; s=c; gateLeft=true; }
    else if (a.kind==='semi'&&b.kind==='ins'&&c.kind==='metal'){ m=c; ins=b; s=a; gateLeft=false; }
    if (!m) continue;
    const ptype = s.dop==='p';
    const VFB = m.phi - s.phi;
    const Cox = ins.eps/Math.max(ins.t,1e-8);
    const phiF = s.phiF;
    const N = Math.max(s.N,1e8);
    const kSurf = gateLeft ? s.nodeStart : s.nodeEnd, kBulk = gateLeft ? s.nodeEnd : s.nodeStart;
    const psi_s = -(Evac(kSurf) - (s.EFt + s.phi));   // surface potential (V) relative to flat band: positive = bands bend down
    const sgn = ptype ? 1 : -1; const ps = sgn*psi_s;
    const regime = F.schematic ? 'flat band (schematic)' : ps < -0.5*kT ? 'accumulation' : ps < phiF ? 'depletion' : ps < 2*phiF ? 'weak inversion' : 'strong inversion';
    const VT = VFB + sgn*(2*phiF + Math.sqrt(2*s.eps*Q*N*2*phiF)/Cox);
    const Wmax = Math.sqrt(2*s.eps*2*phiF/(Q*N));
    const VG = (F.mode==='bias') ? (F.V||0) : 0;
    const Wd = ps>0 ? Math.min(Math.sqrt(2*s.eps*Math.min(ps,2*phiF)/(Q*N)), Wmax) : 0;
    items.push({type:'mos', m, ins, s, ptype, VFB, Cox, phiF, psi_s, regime, VT, Wmax, Wd, gateLeft, VG, pair:m.name+' / '+ins.name+' / '+s.name,
      rows:[
        {k:'V_FB', v:fmtE(VFB,3)+' V', f:'V_FB = φ_m − φ_s = '+fmtE(m.phi)+' − '+fmtE(s.phi,3)+' (no oxide charge, no interface states)'},
        {k:'ψ_s', v:fmtE(psi_s,3)+' V', f:'Surface potential from the solver, '+(ptype?'positive = downward bending (depletion/inversion)':'negative = upward bending (depletion/inversion)')+'\nRegime: '+regime+' (φ_F = kT ln(N/n_i) = '+fmtE(phiF,3)+' V; strong inversion at ψ_s = 2φ_F = '+fmtE(2*phiF,3)+' V)'},
        {k:'regime', v:regime, f:'Classified by ψ_s relative to φ_F and 2φ_F at V_G = '+fmtE(VG,2)+' V'},
        {k:'V_T', v:fmtE(VT,3)+' V', f:'V_T = V_FB '+(ptype?'+':'−')+' 2φ_F '+(ptype?'+':'−')+' √(2ε_s q N · 2φ_F)/C_ox\nC_ox = ε_ox/t_ox = '+(Cox*1e9).toPrecision(3)+' nF/cm² (t_ox = '+fmtLen(ins.t)+')'},
        {k:'W_max', v:fmtLen(Wmax), f:'W_max = √(2ε_s(2φ_F)/(qN)) — maximum depletion width at the onset of strong inversion'},
      ]});
  }
  // forward-bias hint
  let hint='';
  const bt = F.biasTerm||'right';
  if (term.hasPN){ const pSide = term.nGroup==='L'?'right':'left'; hint = 'Forward bias ⇔ V '+(bt===pSide?'> 0':'< 0')+' (p side positive).'; }
  else { const sch = items.find(it=>it.type==='schottky'); if (sch){ const mSide = R[0].kind==='metal'?'left':'right'; const mPos = (bt===mSide); hint = 'Forward bias ⇔ V '+((sch.ntype===mPos)?'> 0':'< 0')+' ('+(sch.ntype?'metal positive w.r.t. n-type':'metal negative w.r.t. p-type')+').'; } }
  return { items, hint };
}

<script id="fermi-render">
'use strict';
/* =====================================================================
   SVG renderers. Figure units are PostScript points (1 pt = 1/72 in), so
   stroke widths and font sizes are literally in pt for journal specs.
   ===================================================================== */
const SUP = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻','+':'⁺'};
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
/* mini markup: E_c, E_{Fn}, 10^{16}, cm^{-3} → tspans */
function tokMarkup(s){
  s=String(s); const parts=[]; let i=0, buf='';
  while (i<s.length){ const ch=s[i];
    if ((ch==='_'||ch==='^') && i+1<s.length){ if (buf){ parts.push({t:'p',v:buf}); buf=''; }
      let j=i+1, tok='';
      if (s[j]==='{'){ const e=s.indexOf('}',j); tok=s.slice(j+1,e<0?s.length:e); i=(e<0?s.length:e+1); } else { tok=s[j]; i=j+1; }
      parts.push({t:ch==='_'?'sub':'sup', v:tok}); continue; }
    buf+=ch; i++; }
  if (buf) parts.push({t:'p',v:buf});

}
function T(s){
  // tokenise into plain runs and sub/sup tokens, then emit tspans; the run after a shift is wrapped in the
  // resetting tspan (an empty tspan does not apply its dy in WebKit).
  const parts=tokMarkup(s); let out='', pending=0;

    else { const dy = pt.t==='sub' ? 0.32 : -0.45; out += '<tspan dy="'+(dy-pending).toFixed(2)+'em" font-size="72%">'+esc(pt.v)+'</tspan>'; pending = dy; }

}
function sciU(x){ // 1×10¹⁶ with unicode superscripts

}
function fmtNum(x, d=2){ return (Math.round(x*Math.pow(10,d))/Math.pow(10,d)).toString(); }

const FONTS = { sans:"'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif", serif:"'Times New Roman', Times, 'Liberation Serif', serif" };
function figColors(theme){ return theme==='dark' ? {bg:'#111111', ink:'#f2f2f2', ink2:'#bbbbbb', grid:'#444444', metal:'#4a4a4a', metalLine:'#dddddd', ins:'#333333'} :

    case 'cross': return `<pattern id="${id}" patternUnits="userSpaceOnUse" width="${s}" height="${s}" patternTransform="rotate(45)"><rect width="${s}" height="${s}" fill="${color}"/><path d="M0 0V${s}M0 0H${s}" stroke="${ink}" stroke-width="${lw*0.8}" stroke-opacity=".35" fill="none"/></pattern>`;
    case 'dots': return `<pattern id="${id}" patternUnits="userSpaceOnUse" width="${s}" height="${s}"><rect width="${s}" height="${s}" fill="${color}"/><circle cx="${s/2}" cy="${s/2}" r="${0.45*scale}" fill="${ink}" fill-opacity=".45"/></pattern>`;
    case 'hlines': return `<pattern id="${id}" patternUnits="userSpaceOnUse" width="${s}" height="${s}"><rect width="${s}" height="${s}" fill="${color}"/><line x1="0" y1="${s/2}" x2="${s}" y2="${s/2}" stroke="${ink}" stroke-width="${lw}" stroke-opacity=".45"/></pattern>`;

function arrowDefs(ink, lw){

  return `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="${ink}" stroke-width="${lw}" marker-start="url(#ah)" marker-end="url(#ah)"/>`;
}
function dimH(x1, x2, y, ink, lw){
  if (Math.abs(x1-x2) < 2.5) return `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${ink}" stroke-width="${lw}"/>`;
  return `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${ink}" stroke-width="${lw}" marker-start="url(#ah)" marker-end="url(#ah)"/>`;

function label(x, y, txt, opts={}){

  const base = `<text x="${x.toFixed(2)}" y="${y.toFixed(2)}" font-size="${fs}" text-anchor="${a}" ${opts.italic?'font-style="italic"':''} ${opts.weight?'font-weight="'+opts.weight+'"':''} ${extra}>${T(txt)}</text>`;
  if (!halo) return `<text x="${x.toFixed(2)}" y="${y.toFixed(2)}" font-size="${fs}" text-anchor="${a}" fill="${fill}" ${opts.italic?'font-style="italic"':''} ${opts.weight?'font-weight="'+opts.weight+'"':''} ${extra}>${T(txt)}</text>`;
  return `<text x="${x.toFixed(2)}" y="${y.toFixed(2)}" font-size="${fs}" text-anchor="${a}" fill="none" stroke="${halo}" stroke-width="${fs*0.32}" stroke-linejoin="round" ${opts.italic?'font-style="italic"':''} ${extra}>${T(txt)}</text>` +

/* quasi-Fermi levels per layer: majority flat at the layer's terminal; minority flat through the depletion

function computeQFL(comp){

  R.forEach((r,i)=>{ if (r.kind!=='semi') return; const n=r.nodeEnd-r.nodeStart+1;

/* candidate positions for the label of a vertical dimension line at x spanning ya..yb (ya above yb).

function vdimCands(x, ya, yb, f, fs, pref, lean, xL, xR){
  const tall=(yb-ya)>=1.3*f; const mid=(ya+yb)/2+0.35*f; if (xL==null) xL=x-0.3*fs; if (xR==null) xR=x+0.3*fs;

  const lead=(cs,py)=>cs.map(c=>Object.assign(c,{lead:{x, y:py}}));
  const abv=k=>{ const y=ya-0.65*f-k*1.25*f; const cs=sw([{x:x-0.4*fs, y, anchor:'start'},{x:x+0.4*fs, y, anchor:'end'}]).concat([{x, y, anchor:'middle'}]); return k>=2 ? lead(cs, ya) : cs; };
  const blw=k=>{ const y=yb+1.3*f+k*1.25*f; const cs=sw([{x:x-0.4*fs, y, anchor:'start'},{x:x+0.4*fs, y, anchor:'end'}]).concat([{x, y, anchor:'middle'}]); return k>=2 ? lead(cs, yb) : cs; };

    inside += `<line x1="${xa.toFixed(2)}" y1="${(y-fs*0.4).toFixed(2)}" x2="${xa.toFixed(2)}" y2="${(y+fs*0.4).toFixed(2)}" stroke="${C.ink}" stroke-width="${lwa}"/>`;
    inside += `<line x1="${xb.toFixed(2)}" y1="${(y-fs*0.4).toFixed(2)}" x2="${xb.toFixed(2)}" y2="${(y+fs*0.4).toFixed(2)}" stroke="${C.ink}" stroke-width="${lwa}"/>`;
    inside += dimH(xa, xb, y, C.ink, lwa); lay.rect(xa, y-fs*0.2, xb, y+fs*0.2, 'arrow');
    const xm=(xa+xb)/2;
    lay.add({txt, fs:f9, fill:C.ink, halo:C.bg, pri, home:{x:xm, y}, ignore:new Set(['soft:wstrip']),
      cands:[{x:xm, y:y-0.65*f9, anchor:'middle'}, {x:xa-0.3*fs, y:y+0.35*f9, anchor:'end'}, {x:xb+0.3*fs, y:y+0.35*f9, anchor:'start'}, {x:xm, y:y-0.65*f9-1.25*f9, anchor:'middle'}, {x:xm, y:y+1.3*f9, anchor:'middle'}]}); };
  analysis.items.forEach(it=>{
    if (it.type==='schottky'){
      const {m,s} = it; const mLeft = R.indexOf(m) < R.indexOf(s); const xi = mLeft ? s.X0 : s.X1; const ks = mLeft ? s.nodeStart : s.nodeEnd;
      const dir = mLeft ? 1 : -1;
      const EcI = EC(s,ks), EvI = EV(s,ks), EF = m.EFt;
      const Ebulk = (s.dop==='p' ? s.EFp : s.EFn) + s.phi;   // flat-band vacuum level
      const EcB = Ebulk - s.chi, EvB = EcB - s.Eg;
      if (fig.annPhiB!==false && it.phiB>0 && !it.ohmic){
        const x = xi - dir*fs*0.55; const y1=Y(EF), y2=Y(it.ntype?EcI:EvI); const ya=Math.min(y1,y2), yb=Math.max(y1,y2);
        inside += dimV(x, y1, y2, C.ink, lwa); arrowRect(x, ya, yb);
        const txt='qφ_{B'+(it.ntype?'n':'p')+'}'+num(it.phiB,'eV'); const wide = m.Xw > fs*5.5;
        const sx = xi+dir*fs*0.25, sa = mLeft?'start':'end';          // semiconductor side, text running away from the interface
        const lvl = k=> it.ntype ? ya-0.65*f9-k*1.25*f9 : yb+1.3*f9+k*1.25*f9;
        const metalSide = {x:x-dir*fs*0.3, y:(ya+yb)/2+0.35*f9, anchor: mLeft?'end':'start'};
        const cands=[]; if (wide) cands.push(metalSide);
        cands.push({x:sx, y:lvl(0), anchor:sa}, {x:sx, y:lvl(1), anchor:sa}, {x:xi+dir*fs*0.3, y:(ya+yb)/2+0.35*f9, anchor:sa});
        if (!wide) cands.push(metalSide); cands.push({x:sx, y:lvl(2), anchor:sa, lead:{x, y:it.ntype?ya:yb}});
        lay.add({txt, fs:f9, fill:C.ink, halo:C.bg, pri:3, pref:it.ntype?'up':'down', lean:dir, ignore:new Set(['soft:metal']), cands, home:{x, y:it.ntype?ya:yb}});
      }
      if (fig.annVbi!==false && it.depl && it.psi_s>0.03 && !it.fullDep){
        const Eb = it.ntype ? EcB : EvB; const Ei = it.ntype ? EcI : EvI;
        const xa = xi + dir*fs*1.3; const xw = it.W ? xi + dir*Math.min(it.W/s.tdom*s.Xw, s.Xw) : xi + dir*s.Xw*0.5;
        inside += `<line x1="${Math.min(xi,xw).toFixed(2)}" y1="${Y(Eb).toFixed(2)}" x2="${Math.max(xi,xw).toFixed(2)}" y2="${Y(Eb).toFixed(2)}" stroke="${C.ink2}" stroke-width="${lwa}" stroke-dasharray="1 1"/>`;
        inside += `<line x1="${xi.toFixed(2)}" y1="${Y(Ei).toFixed(2)}" x2="${xa.toFixed(2)}" y2="${Y(Ei).toFixed(2)}" stroke="${C.ink2}" stroke-width="${lwa}" stroke-dasharray="1 1"/>`;
        const ya=Math.min(Y(Ei),Y(Eb)), yb=Math.max(Y(Ei),Y(Eb));
        inside += dimV(xa, Y(Ei), Y(Eb), C.ink, lwa); arrowRect(xa, ya, yb);
        const txt=(Math.abs(V)>1e-9?'q(V_{bi} − V)':'qV_{bi}')+num(it.psi_s,'eV');
        lay.add({txt, fs:f9, fill:C.ink, halo:C.bg, pri:3, pref:it.ntype?'up':'down', lean:dir, cands:vdimCands(xa, ya, yb, f9, fs, it.ntype?'up':'down', dir), home:{x:xa, y:it.ntype?ya:yb}});
      }
      if (fig.annW!==false && it.W && it.depl && !it.fullDep){
        const xw = xi + dir*Math.min(it.W/s.tdom*s.Xw, s.Xw); const y = py1 - fs*0.75;
        hdim(Math.min(xi,xw), Math.max(xi,xw), y, 'W'+(showNum?' = '+fmtLen(it.W):''), 4);
      }
      if (fig.imageForce && it.depl && it.dphi>0) outside += imageForceInset(comp, fig, G, it);
    }
    if (it.type==='hetero'){
      const {A,B} = it; const xi=A.X1; const kA=A.nodeEnd, kB=B.nodeStart;
      const fdA = A.t>0 && it.xA>A.t, fdB = B.t>0 && it.xB>B.t;
      if (fig.annOffsets!==false && !it.homo){
        const x = xi + fs*0.6;
        const off=(y1,y2,txt,isC)=>{ const ya=Math.min(y1,y2), yb=Math.max(y1,y2);
          inside += `<line x1="${xi}" y1="${y1.toFixed(2)}" x2="${(x+fs*0.3).toFixed(2)}" y2="${y1.toFixed(2)}" stroke="${C.ink2}" stroke-width="${lwa}" stroke-dasharray="1 1"/>`;
          inside += dimV(x, y1, y2, C.ink, lwa); arrowRect(x, ya, yb);
          // ΔE_c lives above the conduction bands, ΔE_v below the valence bands — never in the gap on the E_F line
          const lean = A.Xw >= B.Xw ? -1 : 1;
          lay.add({txt, fs:f85, fill:C.ink, halo:C.bg, pri:2, pref:isC?'up':'down', lean, cands:vdimCands(x, ya, yb, f85, fs, isC?'up':'down', lean, xi-0.15*fs, x+0.3*fs), home:{x, y:isC?ya:yb}}); };
        if (Math.abs(it.dEc)>=0.04) off(Y(EC(A,kA)), Y(EC(B,kB)), 'ΔE_c'+num(Math.abs(it.dEc),'eV'), true);
        if (Math.abs(it.dEv)>=0.04) off(Y(EV(A,kA)), Y(EV(B,kB)), 'ΔE_v'+num(Math.abs(it.dEv),'eV'), false);
      }
      if (fig.annVbi!==false && it.total>0.03 && it.deplA && it.deplB && !fdA && !fdB){
        const EcA=(A.dop==='p'?A.EFp:A.EFn)+A.phi-A.chi, EcB=(B.dop==='p'?B.EFp:B.EFn)+B.phi-B.chi;   // flat-band E_c of each side
        const onA = A.Xw >= B.Xw; const x = onA ? xi - fs*1.6 : xi + fs*1.6;
        const g0 = onA ? xi-fs*2.2 : xi, g1 = onA ? xi : xi+fs*2.2;
        inside += `<line x1="${g0.toFixed(2)}" y1="${Y(EcA).toFixed(2)}" x2="${g1.toFixed(2)}" y2="${Y(EcA).toFixed(2)}" stroke="${C.ink2}" stroke-width="${lwa}" stroke-dasharray="1 1"/>`;
        inside += `<line x1="${g0.toFixed(2)}" y1="${Y(EcB).toFixed(2)}" x2="${g1.toFixed(2)}" y2="${Y(EcB).toFixed(2)}" stroke="${C.ink2}" stroke-width="${lwa}" stroke-dasharray="1 1"/>`;
        const ya=Math.min(Y(EcA),Y(EcB)), yb=Math.max(Y(EcA),Y(EcB));
        inside += dimV(x, Y(EcA), Y(EcB), C.ink, lwa); arrowRect(x, ya, yb);
        const txt=(Math.abs(V)>1e-9?'q(V_{bi} − V)':'qV_{bi}')+num(it.total,'eV');
        lay.add({txt, fs:f9, fill:C.ink, halo:C.bg, pri:3, pref:'up', lean:onA?-1:1, cands:vdimCands(x, ya, yb, f9, fs, 'up', onA?-1:1), home:{x, y:ya}});
      }
      if (fig.annW!==false && it.deplA && it.deplB && it.xA>0 && it.xB>0 && !fdA && !fdB){
        const xa = xi - Math.min(it.xA/A.tdom*A.Xw, A.Xw), xb = xi + Math.min(it.xB/B.tdom*B.Xw, B.Xw); const y = py1 - fs*0.75;
        hdim(xa, xb, y, 'W'+(showNum?' = '+fmtLen(it.xA+it.xB):''), 4);
      }
    }
    if (it.type==='mos' && fig.annVbi!==false && Math.abs(it.psi_s)>0.03){
      const s=it.s; const ks = it.gateLeft ? s.nodeStart : s.nodeEnd; const dir = it.gateLeft?1:-1;
      const xi = it.gateLeft ? s.X0 : s.X1; const xa = xi + dir*fs*1.0;
      const Es=EC(s,ks), Eb=(s.dop==='p'?s.EFp:s.EFn)+s.phi-s.chi;
      inside += `<line x1="${Math.min(xi, xi+dir*fs*2.4).toFixed(2)}" y1="${Y(Eb).toFixed(2)}" x2="${Math.max(xi, xi+dir*fs*2.4).toFixed(2)}" y2="${Y(Eb).toFixed(2)}" stroke="${C.ink2}" stroke-width="${lwa}" stroke-dasharray="1 1"/>`;
      const ya=Math.min(Y(Es),Y(Eb)), yb=Math.max(Y(Es),Y(Eb));
      inside += dimV(xa, Y(Es), Y(Eb), C.ink, lwa); arrowRect(xa, ya, yb);
      lay.add({txt:'qψ_s'+num(it.psi_s,'eV'), fs:f9, fill:C.ink, halo:C.bg, pri:3, lean:dir, cands:vdimCands(xa, ya, yb, f9, fs, 'any', dir), home:{x:xa, y:(ya+yb)/2}});
    }
  });
  return {inside, outside};
}

/* E_g arrows are placed after everything else: per semiconductor layer, the arrow goes to the x where the gap has
   the most free room (no label or arrow in the way) and its label is scanned within the gap, off the E_F line. */
function placeEg(comp, fig, G){
  const {X,Y,EC,EV,fs,lwa,C,lay,font} = G; const {R, prof} = comp; const n=R.length; let svg='';
  if (fig.annEg===false) return '';
  const f=fs*0.9, showNum=fig.showNumbers!==false;
  R.forEach((r,i)=>{ if (r.kind!=='semi' || r.Xw<fs*4) return;
    const full='E_g'+(showNum?' = '+fmtNum(r.Eg,2)+' eV':'');
    const fr = (i===0&&n>1) ? [0.25,0.4,0.55,0.7] : (i===n-1&&n>1) ? [0.72,0.58,0.44,0.3] : [0.5,0.36,0.64,0.24,0.76];
    const xs = fr.map(p=>Math.min(Math.max(r.X0+r.Xw*p, r.X0+fs*1.4), r.X1-fs*1.4));
    let best=null;
    const pc=G.bandXY(r,EC), pv=G.bandXY(r,EV);
    const extent=(pts, x0, x1, y)=>{ let lo=y, hi=y; for (let i=0;i<pts.length;i++){ const p=pts[i]; let inn = p[0]>=x0 && p[0]<=x1;
        if (!inn && i>0){ const q=pts[i-1]; if ((q[0]<x0&&p[0]>x0)||(q[0]>x0&&p[0]<x0)||(q[0]<x1&&p[0]>x1)||(q[0]>x1&&p[0]<x1)) inn=true; }
        if (inn){ if (p[1]<lo) lo=p[1]; if (p[1]>hi) hi=p[1]; } } return {lo,hi}; };
    const spots=[];   // usable arrow positions
    for (const xr of xs){ const k=nearestNode(r, prof, kk=>X(kk,r), xr); const x=X(k,r), yc=Y(EC(r,k)), yv=Y(EV(r,k));
      const seg={x0:x-0.2*fs, y0:yc, x1:x+0.2*fs, y1:yv}; let bad=false;
      for (const p of lay.placed){ if (rectHit(seg,p.box,0.1*fs)){ bad=true; break; } }
      if (!bad) for (const rc of lay.rects){ if ((rc.tag==='arrow'||rc.tag==='mark'||rc.tag==='inset') && rectHit(seg,rc,0.1*fs)){ bad=true; break; } }
      if (!bad) spots.push({x,yc,yv});
    }
    if (!spots.length) return;
    for (const txt of [full,'E_g']){ const b0=lay.box(txt,{x:0,y:0,anchor:'start'},f); const asc=-b0.y0, dsc=b0.y1, w=b0.w;
      for (const sp of spots){ const {x,yc,yv}=sp; const mid=(yc+yv)/2+0.35*f; const cands=[];
        // inside the gap, scanned outward from mid-gap, the box kept between E_c and E_v
        for (const dy of [0,-0.35,0.35,-0.7,0.7,-1.05,1.05,-1.4,1.4,-1.75,1.75,-2.1,2.1].map(q=>q*f)){ const y=mid+dy; if (y-asc < yc+0.1*fs || y+dsc > yv-0.1*fs) continue; cands.push({x:x+0.3*fs, y, anchor:'start'}); cands.push({x:x-0.3*fs, y, anchor:'end'}); }
        // next to the arrow heads, just outside the gap (clear of the band over the whole text run)
        const eR=extent(pc, x+0.3*fs, x+0.3*fs+w, yc), eL=extent(pc, x-0.3*fs-w, x-0.3*fs, yc), vR=extent(pv, x+0.3*fs, x+0.3*fs+w, yv), vL=extent(pv, x-0.3*fs-w, x-0.3*fs, yv);
        cands.push({x:x+0.3*fs, y:eR.lo-0.12*fs-dsc, anchor:'start'}, {x:x-0.3*fs, y:eL.lo-0.12*fs-dsc, anchor:'end'}, {x:x+0.3*fs, y:vR.hi+0.12*fs+asc, anchor:'start'}, {x:x-0.3*fs, y:vL.hi+0.12*fs+asc, anchor:'end'});
        let hit=null;
        for (const c of cands){ const b=lay.box(txt,c,f); if (!lay.inFrame(b)) continue; if (b.x0 < r.X0-0.25*fs || b.x1 > r.X1+0.25*fs) continue; if (lay.clear(b)){ hit=c; break; } }
        if (lay.trace) lay.trace.push({txt:'[E_g '+r.name+' '+txt+' @'+x.toFixed(1)+']', how:hit?'hit':'none', idx:-1, scores:cands.map(c=>{ const b=lay.box(txt,c,f); const sc=lay.score(b); return sc.hard+'/'+sc.soft; })});
        if (hit){ best={x,yc,yv,txt,c:hit}; break; }
        if (!best) best={x,yc,yv,txt:'E_g',c:cands[0],fallback:true};
      }
      if (best && !best.fallback) break;
    }
    if (!best) return;
    svg += dimV(best.x, best.yc, best.yv, C.ink, lwa); lay.rect(best.x-0.2*fs, best.yc, best.x+0.2*fs, best.yv, 'arrow');
    lay.add({txt:best.txt, fs:f, fill:C.ink, halo:C.bg, pri:2, cands:[best.c], home:{x:best.x, y:(best.yc+best.yv)/2}});
  });
  return svg + lay.resolve();
}

function imageForceInset(comp, fig, G, it){
  const {X,Y,EC,fs,lw,lwa,lwf,C,px0,px1,py0,py1,lay,font} = G; const {prof} = comp; const {m,s} = it; const R=comp.R;
  const mLeft = R.indexOf(m) < R.indexOf(s);
  const iw = (px1-px0)*0.30; let ih = (py1-py0)*0.38;
  let ix0, iy0;
  const kb = mLeft ? s.nodeEnd : s.nodeStart; const topE = fig.showEvac ? prof[kb].Evac : null; const botE = EC(s,kb);
  // the title sits above the box; leave room under the box for the E_c/E_F/E_v labels when they are inside the plot on this side
  const ytop = (topE!=null ? Y(topE)+fs*0.6 : py0+fs*0.4) + fs*1.3, ybot = Y(botE)-fs*(G.lblLeft && !mLeft ? 2.0 : 0.6);
  if (ybot - ytop >= ih){ iy0 = ytop + (ybot-ytop-ih)/2; } else if (ybot - ytop >= (py1-py0)*0.26){ ih = ybot-ytop; iy0 = ytop; } else { ih=(py1-py0)*0.34; iy0 = py0 + fs*1.7; }
  ix0 = mLeft ? Math.min(s.X1 - iw - fs*0.6, px1 - iw - fs*0.4) : Math.max(s.X0 + fs*0.6, px0 + fs*0.4 + (G.lblLeft ? (G.widestBand||0) + fs*0.7 : 0));
  const ix1 = ix0 + iw, iy1 = iy0 + ih;
  lay.rect(ix0, iy0, ix1, iy1, 'inset');
  const xmax = Math.max(8*it.xm, 2e-7); const ks = mLeft ? s.nodeStart : s.nodeEnd;
  const EcI = EC(s,ks); const N=128;
  const pts=[], ptsIF=[]; let Emin=Infinity, Emax=-Infinity; let xpk=0, Epk=-Infinity;
  for (let i=0;i<=N;i++){ const x = xmax*i/N; const Ec = EcI - it.Emax*x; const xx = Math.max(x, 0.03*it.xm); const Eif = Ec - Q/(16*Math.PI*s.eps*xx);
    pts.push([x,Ec]); if (i>=2){ ptsIF.push([x,Eif]); if (Eif>Epk){Epk=Eif;xpk=x;} Emin=Math.min(Emin,Eif); } Emax=Math.max(Emax,Ec); }
  Emin = Math.max(Emin, EcI - it.Emax*xmax - 0.02); const span=Math.max(Emax-Emin, 0.02);
  const E0=Emin-0.15*span, E1=Emax+0.6*span;
  const ux = x=> mLeft ? ix0+fs*1.2 + x/xmax*(iw-fs*1.6) : ix1-fs*0.4 - x/xmax*(iw-fs*1.6);
  const uy = e=> iy1-fs*1.0 - (e-E0)/(E1-E0)*(ih-fs*1.5);
  const sub = new Layout(fs, font, {x0:ix0+fs*0.05, y0:iy0+fs*0.05, x1:ix1-fs*0.05, y1:iy1}, C, lwa);
  let o = `<rect x="${ix0.toFixed(2)}" y="${iy0.toFixed(2)}" width="${iw.toFixed(2)}" height="${ih.toFixed(2)}" fill="${C.bg}" stroke="${C.ink2}" stroke-width="${lwa}"/>`;
  const pEc = pts.map(p=>[ux(p[0]),uy(p[1])]), pIF = ptsIF.filter(p=>p[1]>E0).map(p=>[ux(p[0]),uy(p[1])]);
  o += `<polyline points="${pEc.map(p=>p[0].toFixed(2)+','+p[1].toFixed(2)).join(' ')}" fill="none" stroke="${C.ink2}" stroke-width="${lwf}" stroke-dasharray="1.5 1"/>`;
  o += `<polyline points="${pIF.map(p=>p[0].toFixed(2)+','+p[1].toFixed(2)).join(' ')}" fill="none" stroke="${C.ink}" stroke-width="${lw}"/>`;
  sub.line(pEc, 'ec'); sub.line(pIF, 'if');
  const xif = ux(0); o += `<line x1="${xif.toFixed(2)}" y1="${(iy0+fs*0.3).toFixed(2)}" x2="${xif.toFixed(2)}" y2="${(iy1-fs*1.0).toFixed(2)}" stroke="${C.grid}" stroke-width="${lwa}" stroke-dasharray="1.5 1.5"/>`;
  sub.line([[xif, iy0+fs*0.3],[xif, iy1-fs*1.0]], 'guide');
  const xp=ux(xpk); o += `<line x1="${(xp-fs*0.6).toFixed(2)}" y1="${uy(EcI).toFixed(2)}" x2="${(xp+fs*0.6).toFixed(2)}" y2="${uy(EcI).toFixed(2)}" stroke="${C.ink2}" stroke-width="${lwa}" stroke-dasharray="1 1"/>`;
  o += `<line x1="${xp.toFixed(2)}" y1="${uy(Epk).toFixed(2)}" x2="${xp.toFixed(2)}" y2="${(iy1-fs*1.0).toFixed(2)}" stroke="${C.grid}" stroke-width="${lwa}" stroke-dasharray="1.5 1.5"/>`;
  o += dimV(xp, uy(EcI), uy(Epk), C.ink, lwa); sub.rect(xp-fs*0.2, uy(EcI), xp+fs*0.2, uy(Epk), 'arrow');
  const inn = mLeft ? 1 : -1;   // direction into the semiconductor (away from the interface edge of the inset)
  o += lay.fix('image-force lowering', {x: mLeft?ix1:ix0, y: iy0-fs*0.35, anchor: mLeft?'end':'start'}, fs*0.75, {fill:C.ink2, italic:true});
  o += sub.fix(fmtLen(xmax), {x: ux(xmax), y: iy1-fs*0.35, anchor: mLeft?'end':'start'}, fs*0.7, {fill:C.ink2});
  o += sub.fix('0', {x: ux(0), y: iy1-fs*0.35, anchor:'middle'}, fs*0.7, {fill:C.ink2});
  const dphiTxt='Δφ'+(fig.showNumbers!==false?' = '+(it.dphi*1000).toPrecision(2)+' meV':'');
  const an = mLeft?'start':'end';
  sub.add({txt:dphiTxt, fs:fs*0.8, fill:C.ink, halo:C.bg, pri:2, home:{x:xp, y:(uy(EcI)+uy(Epk))/2}, lean:inn,
    cands:[{x:xp+inn*fs*0.5, y:uy(EcI)-fs*0.45, anchor:an}, {x:xp+inn*fs*0.5, y:uy(Epk)+fs*1.3, anchor:an}, {x:xp+inn*fs*0.5, y:uy(Epk)+fs*2.4, anchor:an}, {x:xp+inn*fs*0.5, y:(uy(EcI)+uy(Epk))/2+fs*0.3, anchor:an}]});
  sub.add({txt:'x_m', fs:fs*0.7, fill:C.ink2, pri:3, home:{x:xp, y:iy1-fs*1.0}, lean:inn,
    cands:[{x:xp, y:iy1-fs*0.35, anchor:'middle'}, {x:xp+inn*fs*0.15, y:iy1-fs*0.35, anchor: mLeft?'start':'end'}, {x:xp+inn*fs*0.3, y:uy(Epk)-fs*0.4, anchor: mLeft?'start':'end'}]});
  o += sub.resolve();
  return o;
}

/* ===================== CROSS-SECTION ===================== */
function renderXsec(comp, fig, xs, mats){
  const C = figColors(fig.figTheme);
  const fs = fig.fontSize||7, lw = fig.lineWt||1, lwa=Math.max(0.35,lw*0.5);
  const W = (fig.widthMm||85)/25.4*72; const font = FONTS[fig.font||'sans'];
  const R = comp.R.slice(); if (!R.length) return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}pt" height="${W*0.5}pt" viewBox="0 0 ${W} ${W*0.5}"><rect width="${W}" height="${W*0.5}" fill="${C.bg}"/></svg>`;
  // ordering: first layer at bottom (default) → draw from bottom up
  // rows are laid out bottom-up, so the sequence starts with the layer drawn at the bottom
  let seq = R.map((r,i)=>({r,i})); if (xs.firstAt==='top') seq = seq.reverse();

      body += `<line x1="${(tx-fs*0.4).toFixed(2)}" y1="${(y+h).toFixed(2)}" x2="${(x0).toFixed(2)}" y2="${(y+h).toFixed(2)}" stroke="${C.ink2}" stroke-width="${lwa*0.8}"/>`;

  if (!xs.toScale) out += label(x1+fs*2.4, H-fs*0.3, 'thickness not to scale', {anchor:'start', fs:fs*0.75, fill:C.ink2, italic:true});

  if (fig.fillH && W*fig.aspect>H+0.5){ const Hf=W*fig.aspect, dy=(Hf-H)/2, dx=0;   // centre the drawing in the taller frame

             .replace(`<rect width="${W.toFixed(2)}" height="${H.toFixed(2)}" fill="${C.bg}"/>`, `<rect width="${W.toFixed(2)}" height="${Hf.toFixed(2)}" fill="${C.bg}"/><g transform="translate(${dx.toFixed(2)} ${dy.toFixed(2)})">`).replace(/<\/svg>$/, '</g></svg>'); }

}

/* ===================== 3D DEVICE VIEW =====================

  const C=figColors(fig.figTheme); const fs=fig.fontSize||7, lw=fig.lineWt||1, lwa=Math.max(0.35,lw*0.5);
  const W=(fig.widthMm||85)/25.4*72; const font=FONTS[fig.font||'sans'];
  const R=comp.R.slice(); if (!R.length) return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}pt" height="${W*0.5}pt" viewBox="0 0 ${W} ${W*0.5}"><rect width="${W}" height="${W*0.5}" fill="${C.bg}"/></svg>`;
  let seq=R.map((r,i)=>({r,i})); if (xs.firstAt==='top') seq=seq.reverse();
  if (xs.substrate){ const sub={r:{name:xs.substrateLabel||'Glass', kind:'ins', t:0, t_nm:0, color:'#dfe9f1', isSub:true}, i:-1}; if (xs.firstAt==='top') seq.push(sub); else seq.unshift(sub); }

    else if (topMode==='stripes'){ for (let i=0;i<3;i++) mk(0.1+i*0.29, 0.32+i*0.29, 0, 1); }
    else if (topMode==='fingers'){ mk(0.05,0.95,0.80,0.94); for (let i=0;i<5;i++) mk(0.09+i*0.195, 0.13+i*0.195, 0.06, 0.80); }

  if (xs.light && xs.light!=='none'){ const fromTop=xs.light==='top'; const ref=fromTop?top:boxes[0];
    for (let i=0;i<3;i++){ const ax=ref.x0+(ref.x1-ref.x0)*(0.28+0.22*i), ay=fromTop ? (ref.y0+ref.y1)/2 : ref.y0-0.1; /* from below: in front of the stack, so the arrows stay visible */ arrows.push(fromTop ? [proj(ax,ay,zTop+0.42), proj(ax,ay,zTop+0.06)] : [proj(ax,ay,-0.42), proj(ax,ay,-0.06)]); } }

    else if (sA<-1e-9) f.push({s:0.72, q:[[b.x0,b.y0,b.z0],[b.x0,b.y1,b.z0],[b.x0,b.y1,b.z1],[b.x0,b.y0,b.z1]]});
    f.push({s:0.87, q:[[b.x0,b.y0,b.z0],[b.x1,b.y0,b.z0],[b.x1,b.y0,b.z1],[b.x0,b.y0,b.z1]]});
    f.push({s:1.05, q:[[b.x0,b.y0,b.z1],[b.x1,b.y0,b.z1],[b.x1,b.y1,b.z1],[b.x0,b.y1,b.z1]]});
    f.forEach(fc=>{ const pts=fc.q.map(v=>proj(v[0],v[1],v[2])); pts.forEach(p=>P.push(p)); polys.push({pts, fill:shadeOn?shadeHex(b.col, fc.s):b.col, col:b.col, op:b.op}); }); });
  arrows.forEach(a=>{ P.push(a[0]); P.push(a[1]); });
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity; P.forEach(p=>{ if (p[0]<minX) minX=p[0]; if (p[0]>maxX) maxX=p[0]; if (p[1]<minY) minY=p[1]; if (p[1]>maxY) maxY=p[1]; });
  // labels

  if (showLab){ seq.forEach(({r},k)=>{ const bs=boxes.filter(b=>b.k===k); if (!bs.length) return; let best=null;
      bs.forEach(b=>{ const zm=(b.z0+b.z1)/2; const a= sA>1e-9 ? proj(b.x1,(b.y0+b.y1)/2,zm) : proj(b.x1-(b.x1-b.x0)*0.08,b.y0,zm); if (!best||a[0]>best[0]) best=a; });
      const nm=(r.kind==='semi'&&r.dop&&r.dop!=='i' ? r.dop+'-'+r.name : r.name) + (xs.showThickness!==false && !r.isSub && r.t>0 ? '  ('+fmtLen(r.t)+')' : '');
      labs.push({a:best, txt:nm}); }); }
  const labW=showLab ? Math.max(...labs.map(l=>textW(l.txt, fs)), fs*2) : 0;
  const mL=fs*1.4, mR=showLab ? fs*3.0+labW+fs*0.6 : fs*1.4, mT=fs*1.6, mB=fs*1.6+(xs.toScale?0:fs*1.0);
  let s=(W-mL-mR)/Math.max(maxX-minX,1e-6); const Hmax=(fig.fillH ? W*fig.aspect : W*1.15)-mT-mB; if ((maxY-minY)*s>Hmax) s=Hmax/(maxY-minY);

    if (arrows.length){ const a=arrows[arrows.length-1]; o+=label(SX(a[0])+fs*0.7, (SY(a[0])+SY(a[1]))/2+fs*0.35, 'hν', {fs, fill:C.ink, italic:true}); } return o; };
  polys.forEach(pl=>{ const d='M'+pl.pts.map(p=>SX(p).toFixed(2)+' '+SY(p).toFixed(2)).join('L')+'Z';
    const st= edge==='ink' ? C.ink : edge==='none' ? pl.fill : shadeHex(pl.col, 0.5);
    body+=`<path d="${d}" fill="${pl.fill}"${pl.op<1?` fill-opacity="${pl.op}"`:''} stroke="${st}" stroke-width="${(edge==='none'?0.25:lw*0.45).toFixed(2)}" stroke-linejoin="round"/>`; });

  if (showLab){ const lx=offX+(maxX-minX)*s+fs*2.6; const L=labs.map(l=>({l, ax:SX(l.a), ay:SY(l.a), y:SY(l.a)})).sort((p,q)=>p.y-q.y); const gapL=fs*1.35;

    L.forEach(o=>{ body+=`<circle cx="${o.ax.toFixed(2)}" cy="${o.ay.toFixed(2)}" r="${(fs*0.14).toFixed(2)}" fill="${C.ink}"/>`+
        `<path d="M${o.ax.toFixed(2)} ${o.ay.toFixed(2)}L${(lx-fs*1.3).toFixed(2)} ${o.y.toFixed(2)}L${(lx-fs*0.4).toFixed(2)} ${o.y.toFixed(2)}" fill="none" stroke="${C.ink}" stroke-width="${lwa.toFixed(2)}" stroke-linejoin="round"/>`+
        label(lx, o.y+fs*0.35, o.l.txt, {fs, fill:C.ink}); }); }
  if (!xs.toScale) body+=label(mL, H-fs*0.5, 'schematic, thickness not to scale', {fs:fs*0.75, fill:C.ink2, italic:true});

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W.toFixed(2)}pt" height="${H.toFixed(2)}pt" viewBox="0 0 ${W.toFixed(2)} ${H.toFixed(2)}" font-family="${font}" font-size="${fs}" fill="${C.ink}"><title>Device structure (3D schematic): ${esc(R.map(r=>r.name).join(' / '))}</title><defs>${defs}</defs><rect width="${W.toFixed(2)}" height="${H.toFixed(2)}" fill="${C.bg}"/>${body}</svg>`;

/* =====================================================================

function prepTable(tb){ if (tb._E) return tb; const pts=tb.pts.slice().sort((a,b)=>b[0]-a[0]); /* increasing E */ tb._E=pts.map(p=>hc_eVnm/p[0]); tb._la=pts.map(p=>Math.log(p[1])); return tb; }
/* α(E) in cm⁻¹ for a layer's optical model {model:'table'|'analytic'|'none', table, alpha0, Eg} */
function alphaAt(opt, E){
  if (!opt || opt.model==='none') return 0;
  if (opt.model==='table' && opt.table){ const tb=prepTable(opt.table); const Es=tb._E, la=tb._la, n=Es.length;
    if (E<=Es[0]) return Math.exp(la[0] - (Es[0]-E)/(tb.EU||0.015));           // Urbach tail below the last tabulated energy
    if (E>=Es[n-1]) return Math.exp(la[n-1]);
    let lo=0, hi=n-1; while (hi-lo>1){ const m=(lo+hi)>>1; if (Es[m]<=E) lo=m; else hi=m; }
    const t=(E-Es[lo])/(Es[hi]-Es[lo]); return Math.exp(la[lo]+t*(la[hi]-la[lo])); }
  const Eg=opt.Eg; if (!(E>Eg)) return 0; return (opt.alpha0||1e5)*Math.sqrt(E-Eg);
}

/* ---------- problem assembly ----------

     nodes:  figure grid {x, L, R, dir} from buildGrid(R, V_max)
     dd:     per-layer transport/optics [{mun, mup, taun, taup, Et, B, Cn, Cp, opt:{model, table?, alpha0, Eg}, absorb, Tf, Sn, Sp}]
     contacts: {left:{model:'ohmic'|'schottky'|'pinned', An, Ap}, right:{…}}, biasTerm:'left'|'right', T

      else { Lr.ns=Lr.ne=(nodes[k].L===i? x.length : figMap[k]); } Lr.xs=r.x0+shift; continue; }

  for (let i=0;i<R.length;i++){ const r=R[i]; if (r.kind==='metal'){ const k=r.nodeStart; layers[i].ns=layers[i].ne=figMap[k]; } }

    L.B=d.B||0; L.Cn=d.Cn||0; L.Cp=d.Cp||0; L.Et=d.Et||0; L.Nd=L.dop==='n'?L.N:0; L.Na=L.dop==='p'?L.N:0;

    L.Sn=d.Sn||0; L.Sp=d.Sp||0; L.absorb=d.absorb!==false; L.opt=d.opt||{model:'none'}; L.tphys=L.t>0?L.t:(L.tdom||0); }

/* terminal Fermi levels for a bias V (eV): the biased terminal moves to −V, as in the figure */
function terminals(P, V){ const EFL = P.biasTerm==='left' ? -V : 0, EFR = P.biasTerm==='right' ? -V : 0; return {EFL, EFR, EF:(g)=>g==='L'?EFL:EFR}; }

/* ---------- generation per element (cm⁻³ s⁻¹), element e spans nodes e..e+1 and belongs to layer Rn[e] ----------

function generation(P, light){

  if (!light || light.model==='none') return out;

  const Egmin=Math.min(...semis.filter(L=>L.absorb).map(L=>L.Eg).concat([Infinity])); out.Egmin=isFinite(Egmin)?Egmin:Math.min(...semis.map(L=>L.Eg));
  const isAbs = L=> L.kind==='semi' && L.absorb;

    for (let e=0;e<N-1;e++){ const L=P.layers[P.Rn[e]]; if (isAbs(L)){ Ge[e]=G; const dx=P.x[e+1]-P.x[e]; out.Jgen+=q*G*dx; out.perLayer[L.i]=(out.perLayer[L.i]||0)+q*G*dx; } }

/* ---------- Shockley–Queisser detailed balance on the embedded AM1.5G spectrum ----------

/* radiative V_oc limit for an actual short-circuit current and gap */
function vocRad(Jsc, Eg, T){ const s=sqLimit(Eg, T); return { Voc: (kB*(T||300))*Math.log(Math.max(Jsc,0)/s.J0+1), J0:s.J0 }; }


/* ---------- coupled Newton solver ----------

   n = N_c exp((E_Fn − E_c)/kT), p = N_v exp((E_v − E_Fp)/kT), E_c = −ψ − χ, E_v = E_c − E_g (per layer, so a shared
   interface node carries two densities and the quasi-Fermi levels are continuous across heterointerfaces).
   Scharfetter–Gummel fluxes in the generalized form J_n = (qD_n/h)[n_{k+1}B(−δ) − n_k B(δ)], δ = (E_c,k+1 − E_c,k)/kT,

const RC=new Float64Array(6);

/* innermost metal at an end (ITO|PEDOT: the PEDOT sets the barrier), or null */
function endMetal(P, end){ const Ls=P.layers; let i = end==='left'?0:Ls.length-1, m=null; const step=end==='left'?1:-1; while (i>=0 && i<Ls.length && Ls[i].kind==='metal'){ m=Ls[i]; i+=step; } return m; }
/* contact set-up for a bias point: Dirichlet ψ and the carrier condition at both ends */

    else if (!metal || c.model==='ohmic'){ // ideal ohmic: flat band; majority carriers at equilibrium, minority carriers with a surface recombination velocity S (SCAPS convention; S = 0 → selective contact)
      typ=2; psiC=-(EFt+semi.phi); pinN = semi.dop==='n'; pinP = semi.dop==='p'; vn=pinN?0:(c.Sn==null?1e7:c.Sn); vp=pinP?0:(c.Sp==null?1e7:c.Sp); }
    else if (c.model==='pinned'){ typ=2; psiC=-(EFt+metal.phi); pinN=true; pinP=true; }                        // work-function alignment, S = ∞ for both carriers
    else { typ=2; psiC=-(EFt+metal.phi); vn=c.An*P.T*P.T/(q*semi.Nc); vp=c.Ap*P.T*P.T/(q*semi.Nv); }     // thermionic emission, barrier φ_B = φ_m − χ (Richardson velocity A*T²/qN)

/* 3×3 block-tridiagonal solve (block Thomas with partial pivoting inside each 3×3 pivot block). A,B,C: Float64Array(9N) row-major blocks; r: Float64Array(3N). Returns δ. */
let TW=null;

  html+=`<div class="field"><label>Colour</label><div class="row"><input type="color" data-key="color" value="${Ly.color||m.color||'#888888'}" style="width:42px;padding:0;height:24px"><select data-key="hatch" aria-label="Hatch"><option value="">library</option>${['solid','diag','cross','dots','hlines'].map(h=>`<option value="${h}" ${Ly.hatch===h?'selected':''}>${h}</option>`).join('')}</select></div><span></span></div>`;
  html+=`<div class="btnrow"><button class="btn sm reset-ov">Reset to library</button><button class="btn sm dup">Duplicate</button><button class="btn sm del" style="color:var(--crit)">Remove</button></div>`;
  html+=`<div class="src">${esc(m.src||'')}${m.note?' <em>'+esc(m.note)+'</em>':''}</div>`;
  const adv=simParamFields(Ly, m); if (adv) html+=`<details${Ly.dd&&Object.keys(Ly.dd).length?' open':''}><summary>Advanced: transport and optical values (used for illumination and spatial profiles)</summary>${adv}</details>`;

function bindParamFields(div, Ly, m){
  $$('.more [data-key]',div).forEach(inp=>{ inp.addEventListener('change', ()=>{ const prev=snapshot(); const k=inp.dataset.key;
    if (k==='x'){ Ly.x=Math.min(1,Math.max(0,parseFloat(inp.value)||0)); }
    else if (k==='label'){ Ly.label=inp.value.trim(); if(!Ly.label) delete Ly.label; }
    else if (k==='color'){ Ly.color=inp.value; }
    else if (k==='hatch'){ if (inp.value) Ly.hatch=inp.value; else delete Ly.hatch; }
    else { const v=parseFloat(inp.value); Ly.ov=Ly.ov||{}; if (isFinite(v)) Ly.ov[k]=v; }
    commit({prev}); renderLayers(); }); });
  $('.reset-ov',div).addEventListener('click', e=>{ e.stopPropagation(); const prev=snapshot(); Ly.ov={}; delete Ly.color; delete Ly.hatch; delete Ly.label; commit({prev}); renderLayers(); });
  $('.dup',div).addEventListener('click', e=>{ e.stopPropagation(); const prev=snapshot(); const i=state.stack.layers.indexOf(Ly); const c=JSON.parse(JSON.stringify(Ly)); c.id=uid(); c._open=false; state.stack.layers.splice(i+1,0,c); commit({prev}); renderLayers(); });
  $('.del',div).addEventListener('click', e=>{ e.stopPropagation(); const prev=snapshot(); state.stack.layers = state.stack.layers.filter(x=>x!==Ly); commit({prev}); renderLayers(); });
  bindSimFields(div, Ly);
}
function moveLayer(i, d){ const j=i+d; if (j<0||j>=state.stack.layers.length) return; const prev=snapshot(); const a=state.stack.layers; [a[i],a[j]]=[a[j],a[i]]; commit({prev}); renderLayers(); }
function addLayer(){ const prev=snapshot(); const last=state.stack.layers[state.stack.layers.length-1]; const mat = last && mats[last.mat].kind==='metal' ? 'Si' : 'Au'; const m=mats[mat];
  state.stack.layers.push(L(mat, m.kind==='metal'?100:1000, m.kind==='semi'?m.defType:'i', m.kind==='semi'?m.defN:0)); commit({prev}); renderLayers(); }

const STYLE_KEYS=['font','fontSize','lineWt','widthMm','aspect','figTheme','pFrame','pTicks','pMinor','pGrid','pLegend'];   // what a saved style preset carries
function loadStylePresets(){ try{ return JSON.parse(localStorage.getItem('fermi.stylePresets')||'{}'); }catch(e){ return {}; } }
function saveStylePresets(ps){ try{ localStorage.setItem('fermi.stylePresets', JSON.stringify(ps)); }catch(e){} }

function bindPanel(p){
  $$('[data-obj]',p).forEach(inp=>{
    const obj=inp.dataset.obj, key=inp.dataset.key;
    const handler=(ev)=>{ const o=state[obj]; let v;
      if (inp.type==='checkbox') v=inp.checked; else if (inp.type==='number'||inp.type==='range') v=parseFloat(inp.value); else v=inp.value;
      if (key==='widthMm') v=parseFloat(v);
      if (inp.type==='range' && ev.type==='input'){ o[key]=v; recompute(); syncPanel(p, inp); return; }
      const prev = inp._prev!=null ? inp._prev : snapshot(); inp._prev=null; o[key]=v; commit({prev}); syncPanel(p); };
    if (inp.type==='range'){ inp.addEventListener('pointerdown',()=>{ inp._prev=snapshot(); }); inp.addEventListener('input',handler); inp.addEventListener('change',handler); }
    else inp.addEventListener('change',handler);
  });

function syncPanel(p, except){
  $$('[data-obj]',p).forEach(inp=>{ if (inp===except) return; const v=state[inp.dataset.obj][inp.dataset.key]; if (inp.type==='checkbox') inp.checked=!!v; else inp.value=v; });
  const f=state.fig; $('#biasRow').style.display = f.mode==='bias'?'':'none'; $('#eWinRow').style.display = f.eWin==='manual'?'':'none';
  $$('[data-for]', p).forEach(d=>{ d.hidden=!d.dataset.for.split(' ').includes(currentFig); });   // only the settings of the view that is open
  $$('.fixedShape', p).forEach(d=>{ if (f.fitPane!==false) d.hidden=true; });
  $('#lightRow').style.display = f.lightOn?'':'none'; if (f.eWin!=='manual') $('#eWinRow').hidden=true; $('#d3GapRow').style.display = state.xs.d3Style==='exploded'?'':'none';

  const sp=$('#stylePreset'); if (sp){ const ps=loadStylePresets(); const mine=Object.keys(ps).find(n=>STYLE_KEYS.every(k=>ps[n][k]===undefined||ps[n][k]===f[k]));
    sp.value = mine ? 'my:'+mine : (f.font==='sans'&&f.fontSize===7&&f.lineWt===1)?'nature':(f.font==='serif'&&f.fontSize===8&&f.lineWt===1)?'elsevier':(f.font==='sans'&&f.fontSize===7&&f.lineWt===0.75)?'acs':'custom';
    const db=$('#delPreset'); if (db) db.hidden=!mine; }
}
