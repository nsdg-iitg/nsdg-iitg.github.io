/* ---------- licence: offline verification with WebCrypto ----------
   Key = FERMI-<base64url payload JSON>.<base64url raw r||s ECDSA P-256/SHA-256 signature>
   payload {e:email, p:plan, x:expiryISO, i:issuedISO, n:nonce}; signed by tools/issue-license.py.
   The key is verified here against FERMI_CONFIG.publicKey, stored in localStorage, never sent anywhere. */
function b64uToBytes(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length%4) s+='='; const bin=atob(s); const u=new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
function fmtDate(d){ return d.toISOString().slice(0,10); }
function isPro(){ return true; }   // NSDG edition: every export option is open to all visitors, no licence key is needed
async function verifyLicenseKey(raw){
  const key=(raw||'').replace(/\s+/g,'');
  if (!/^FERMI-[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(key)) return {ok:false, reason:'format', msg:'That does not look like a Fermi key (FERMI-….…). Paste the whole key, including the part after the dot.'};
  let payload, pb, sig;
  try{ const [p,s]=key.slice(6).split('.'); pb=b64uToBytes(p); sig=b64uToBytes(s); payload=JSON.parse(new TextDecoder().decode(pb)); }catch(e){ return {ok:false, reason:'format', msg:'The key could not be decoded — part of it seems to be missing.'}; }
  if (sig.length!==64 || !payload || typeof payload!=='object' || !payload.e || !payload.p || !payload.x) return {ok:false, reason:'format', msg:'The key is incomplete.'};
  if (!(window.crypto && crypto.subtle)) return {ok:false, reason:'nocrypto', msg:'This page cannot verify keys here: WebCrypto needs https://, localhost or a local file.'};
  let valid=false;
  try{ const pub=await crypto.subtle.importKey('spki', b64uToBytes(FERMI_CONFIG.publicKey), {name:'ECDSA', namedCurve:'P-256'}, false, ['verify']);
       valid=await crypto.subtle.verify({name:'ECDSA', hash:'SHA-256'}, pub, sig, pb); }catch(e){ return {ok:false, reason:'nocrypto', msg:'Key verification failed in this browser: '+e.message}; }
  if (!valid) return {ok:false, reason:'signature', msg:'This key’s signature does not verify — it was altered in transit or it is not a Fermi key. Paste it again exactly as it was sent.'};
  const exp=new Date(payload.x); if (isNaN(exp)) return {ok:false, reason:'format', msg:'The key has no readable expiry date.'};
  if (exp.getTime()<=Date.now()) return {ok:false, reason:'expired', payload, msg:'The Pro key for '+payload.e+' expired on '+fmtDate(exp)+'.'};
  return {ok:true, payload, key};
}

/* ---------- help ---------- */
function helpHTML(){ return `
  <h2 id="helpTitle">Physics model and assumptions</h2>
  <p>Fermi computes the equilibrium (or quasi-equilibrium) band diagram of the stack by solving the one-dimensional Poisson equation with Boltzmann carrier statistics on every layer at once, so accumulation, depletion, inversion, fully depleted thin layers and multi-junction stacks all come from the same solution. The quantities in the readout strip are the textbook closed-form values so that you can check them against Sze &amp; Ng.</p>
  <h3>Band alignment</h3>
  <ul><li>Anderson’s rule: vacuum level continuous across every interface; ΔE_c = χ₁ − χ₂, ΔE_v = (χ₂ + E_g₂) − (χ₁ + E_g₁). No interface dipoles, no Fermi-level pinning, no interface states, no fixed oxide charge.</li>
  <li>Schottky–Mott limit: φ_Bn = φ_m − χ, φ_Bp = χ + E_g − φ_m. Real contacts on Si, GaAs and most III–Vs are partly pinned; enter a measured φ_B by editing φ_m in the layer.</li></ul>
  <h3>Statistics</h3>
  <ul><li>Boltzmann statistics with complete ionization; n₀ from charge neutrality with n_i = √(N_c N_v) exp(−E_g/2kT). N_c, N_v scale as T^{3/2}.</li>
  <li>A layer whose Fermi level sits within kT ln 2 of a band edge is flagged degenerate; the Fermi level there is approximate (Fermi–Dirac would move it by tens of meV).</li>
  <li>Transparent conductors (ITO, FTO) are treated as metals with a work function. PEDOT:PSS is a heavily p-doped semiconductor (hole transport layer).</li></ul>
  <h3>Electrostatics</h3>
  <ul><li>Nonlinear Poisson equation solved by damped Newton iteration on a clustered grid (320 nodes per semiconductor layer). Layers much thicker than their depletion region (beyond a few hundred nm) are truncated to a quasi-neutral domain, marked with a break symbol, so the junction region is resolved.</li>
  <li>Depletion width W, E_max and the hetero-partition x_n/x_p in the readouts use the depletion approximation with the solver’s band bending; the drawn curve is the exact Boltzmann solution and therefore has a tail of a few Debye lengths.</li>
  <li>Image-force lowering: Δφ = √(qE_max/4πε_s), x_m = √(q/16πε_s E_max) with the static permittivity. E_max = √(2qN(V_bi − V)/ε_s), i.e. without Sze’s −kT/q correction (1–3 % effect).</li></ul>
  <h3>Applied bias</h3>
  <ul><li>V is applied to the chosen contact relative to the other. Majority-carrier quasi-Fermi levels are flat in their own quasi-neutral regions and separated by qV; minority quasi-Fermi levels are drawn flat across the depletion region and relax towards the majority level in the quasi-neutral region. This is the standard low-injection picture, not a drift–diffusion solution; it is not valid near V_bi or under illumination.</li>
  <li>MOS gate bias: the semiconductor is in equilibrium with its contact (no gate leakage), so inversion layers form as in a quasi-static C–V.</li></ul>
  <h3>Schematic mode</h3>
  <p>Draws every layer at its flat-band alignment (E_F continuous, vacuum level stepping by the work-function difference at each interface) with band offsets and barrier heights annotated but no band bending — the conceptual "before contact / energy-level alignment" figure. Switch it off to get the solved electrostatics.</p>
  <h3>Illumination and spatial profiles</h3>
  <ul><li>The band diagram under light and every curve of the Spatial profiles view come from one steady-state solution at the chosen bias: Poisson and the electron and hole continuity equations (drift–diffusion, Scharfetter–Gummel fluxes) with Boltzmann statistics, and SRH, radiative and Auger recombination.</li>
  <li>Generation: AM1.5G (ASTM G173-03) with Beer–Lambert absorption. Tabulated α for Si, GaAs, CdTe and MAPbI₃, analytic α₀√(E − E_g) otherwise. No optical interference and no reflection.</li>
  <li>Contacts: thermionic emission over the Schottky–Mott barrier of the band diagram.</li>
  <li>Not modelled: mobile ions, transients, Fermi–Dirac statistics, tunnelling. Fermi does not compute J–V curves; use CEISIM for device simulation.</li></ul>
  <h3>Figure conventions</h3>
  <ul><li>The horizontal axis is compressed layer by layer (width ∝ thickness^γ) unless γ = 1, in which case a scale bar is drawn and metals keep a fixed width.</li>

  if (q==='np'){ series=[{arr:pr.n, col:PAL.blue, name:'n'},{arr:pr.p, col:PAL.orange, name:'p'}]; ylab='Carrier density (cm^{-3})'; logY=true; floor=1; }
  else if (q==='gr'){ series=[{arr:pr.Rsrh, col:PAL.blue, name:'R_{SRH}'},{arr:pr.Rrad, col:PAL.orange, name:'R_{rad}'},{arr:pr.Raug, col:PAL.aqua, name:'R_{Auger}'}]; if (light) series.unshift({arr:pr.G, col:C.ink, name:'G', dash:'3 1.5'}); ylab='Rate (cm^{-3} s^{-1})'; logY=true; floor=1e6; }
  else if (q==='qfl'){ const a=new Float64Array(N); for (let k=0;k<N;k++) a[k]=pr.Efn[k]-pr.Efp[k]; series=[{arr:a, col:C.ink, name:'E_{Fn} − E_{Fp}'}]; ylab='E_{Fn} − E_{Fp} (eV)'; }
  else if (q==='rho'){ const a=new Float64Array(N); for (let k=0;k<N;k++){ const L=P.layers[pr.layer[k]]; a[k]= L&&L.kind==='semi' ? pr.p[k]-pr.n[k]+(L.Nd||0)-(L.Na||0) : NaN; } series=[{arr:a, col:C.ink, name:''}]; ylab='Space charge ρ/q'; }
  else if (q==='field'){ const a=new Float64Array(N); for (let k=0;k<N;k++){ const j=Math.min(k, N-2), h=P.x[j+1]-P.x[j]; a[k]= h>0 ? -(st.psi[j+1]-st.psi[j])/h : NaN; } series=[{arr:a, col:C.ink, name:''}]; ylab='Electric field'; pick=bodyNode; }
  else { const a=new Float64Array(N); for (let k=0;k<N;k++) a[k]=st.psi[k]-st.psi[0]; series=[{arr:a, col:C.ink, name:''}]; ylab='Electrostatic potential (V)'; pick=bodyNode; }
  // linear axes with large or small numbers carry a power of ten in the axis title
  let pow=0; if (!logY && (q==='rho'||q==='field')){ let mx=0; for (const s of series) for (let k=0;k<N;k++) if (pick(k) && isFinite(s.arr[k])) mx=Math.max(mx, Math.abs(s.arr[k])); if (mx>0) pow=Math.floor(Math.log10(mx)); const sc=Math.pow(10,pow); for (const s of series) s.arr=s.arr.map(v=>v/sc);
    ylab += q==='rho' ? ' (10^{'+pow+'} cm^{-3})' : ' (10^{'+pow+'} V cm^{-1})'; }
  let out=`<svg xmlns="http://www.w3.org/2000/svg" width="${W.toFixed(2)}pt" height="${H.toFixed(2)}pt" viewBox="0 0 ${W.toFixed(2)} ${H.toFixed(2)}" font-family="${font}" font-size="${fs}" fill="${C.ink}"><title>${esc(ylab.replace(/[\^_{}]/g,''))} at V = ${V} V</title><rect width="${W.toFixed(2)}" height="${H.toFixed(2)}" fill="${C.bg}"/>`;
  const lay=new Layout(fs, font, {x0:fs*0.15,y0:fs*0.15,x1:W-fs*0.15,y1:H-fs*0.15}, C, lwa);
  Ls.forEach(L=>{ const m=Xl[L.i]; if (m.Xw>fs*1.2) out+=lay.fix((L.dop&&L.dop!=='i'?L.dop+'-':'')+L.name, {x:m.X0+m.Xw/2, y:mT-fs*0.9, anchor:'middle'}, fs, {fill:C.ink}); });
  for (let i=0;i<Ls.length-1;i++){ const x=Xl[Ls[i].i].X0+Xl[Ls[i].i].Xw; out+=`<line x1="${x.toFixed(2)}" y1="${mT}" x2="${x.toFixed(2)}" y2="${y1.toFixed(2)}" stroke="${C.grid}" stroke-width="${lwa}" stroke-dasharray="1.5 1.5"/>`; }
  let lo=Infinity, hi=-Infinity; const xs=[]; for (let k=0;k<N;k++) if (pick(k)) xs.push(k);
  const data=series.map(s=>{ const pts=[]; for (const k of xs){ let v=s.arr[k]; if (logY){ if (!(v>floor)) continue; v=Math.log10(v); } if (!isFinite(v)) continue; pts.push([X(k), v]); if (v<lo) lo=v; if (v>hi) hi=v; } return {s, pts}; });
  if (!isFinite(lo)){ lo=0; hi=1; } if (logY){ lo=Math.floor(lo); hi=Math.ceil(hi); if (hi-lo<2) hi=lo+2; if (hi-lo>24) lo=hi-24; } else { const minSpan=0.02; if (hi-lo<minSpan){ const mid=(hi+lo)/2; lo=mid-minSpan/2; hi=mid+minSpan/2; } const pad=(hi-lo)*0.08; lo-=pad; hi+=pad; }   // a flat curve still gets a finite axis
  const Y=v=>y1-(v-lo)/(hi-lo)*ph;
  const yt=[], ym=[]; if (logY){ const stp=Math.max(1, Math.ceil((hi-lo)/8)); for (let e=lo; e<=hi; e++){ if ((e-lo)%stp===0) yt.push({p:Y(e), lab:pow10Label(e)}); else ym.push(Y(e)); } }
  else { const tk=axisTicks(lo, hi, 6); for (const v of tk.ticks) yt.push({p:Y(v), lab:fmtTick(v)}); for (const v of minorVals(lo, hi, tk.step)) ym.push(Y(v)); }
  out+=plotAxes(PF, fig, {x0:mL, x1:W-mR, y0, y1, yt, ym, ylabel:ylab});
  if (!logY && lo<0 && hi>0) out+=`<line x1="${mL.toFixed(2)}" y1="${Y(0).toFixed(2)}" x2="${(W-mR).toFixed(2)}" y2="${Y(0).toFixed(2)}" stroke="${C.ink2}" stroke-width="${(lwa*0.7).toFixed(2)}" stroke-dasharray="2 1.5"/>`;
  for (const d of data){ if (d.pts.length<2) continue; const pp=d.pts.map(p=>[p[0], Math.min(y1, Math.max(y0, Y(p[1])))]); out+=`<polyline points="${pp.map(p=>p[0].toFixed(2)+','+p[1].toFixed(2)).join(' ')}" fill="none" stroke="${d.s.col}" stroke-width="${d.s.dash?lw*0.8:lw}" stroke-linejoin="round" ${d.s.dash?'stroke-dasharray="'+d.s.dash+'"':''}/>`; lay.line(pp,'band');
    if (d.s.name && fig.pLegend!=='none'){ const e=pp[pp.length-1], m=pp[Math.floor(pp.length*0.5)]; lay.add({txt:d.s.name, fs:fs*0.9, fill:d.s.col, halo:C.bg, pri:1, home:{x:m[0],y:m[1]}, cands:[{x:m[0],y:m[1]-fs*0.5,anchor:'middle'},{x:m[0],y:m[1]+fs*1.1,anchor:'middle'},{x:e[0]-fs*0.3,y:e[1]-fs*0.5,anchor:'end'},{x:e[0]-fs*0.3,y:e[1]+fs*1.1,anchor:'end'}]}); } }
  out+=lay.fix('V = '+V+' V'+(light?', illuminated':', dark')+(gamma>=0.999?'':'; position not to scale'), {x:mL, y:H-fs*0.7, anchor:'start'}, fs*0.8, {fill:C.ink2, italic:true});
  out+=lay.resolve();
  const sc=Math.pow(10,pow); lastProfiles[q]={ylab, x:xs.map(k=>P.x[k]*1e7), cols:series.map(s=>({name:s.name||ylab, v:xs.map(k=>s.arr[k]*sc)}))};
  return out+`</svg>`;
}
function profileCSV(){ const q=(PROFILE_Q[figIdx.prof||0]||PROFILE_Q[0])[0]; const d=lastProfiles[q]; if (!d) return '';
  const clean=s=>String(s).replace(/[\^_{}]/g,'').replace(/,/g,';'); const out=['x (nm),'+d.cols.map(c=>clean(c.name)).join(',')];
  d.x.forEach((x,i)=>out.push([x.toPrecision(7)].concat(d.cols.map(c=>isFinite(c.v[i])?c.v[i].toExponential(6):'')).join(','))); return out.join('\n')+'\n'; }

/* SIMULATE UI END */
/* ---------- boot ---------- */
function rebuildAll(){ renderLayers(); renderMaterials(); syncPanel($('#tab-figure')); recompute(); $('#templateSel').value = state.template||''; }
function init(){
  mats = loadMats();
  const sel=$('#templateSel'); sel.innerHTML='<option value="">Templates…</option>'+TEMPLATES.map(t=>`<option value="${t.key}">${esc(t.name)}</option>`).join('');
  let saved=null; try{ saved=localStorage.getItem('fermi.project'); }catch(e){}
  if (saved){ try{ loadSnapshot(saved); }catch(e){ state=freshState(); } } else state=freshState();
  lastSnap=snapshot();
  sel.addEventListener('change', e=>{ const t=TEMPLATES.find(x=>x.key===e.target.value); if (!t) return; const prev=snapshot(); state=freshState(t); commit({prev}); rebuildAll(); });
  $('#undoBtn').addEventListener('click', undo); $('#redoBtn').addEventListener('click', redo);
  $('#addLayerBtn').addEventListener('click', addLayer);
  $('#addMatBtn').addEventListener('click', ()=>openMatForm(null));
  $('#resetMatsBtn').addEventListener('click', ()=>{ if (confirm('Reset all materials to library defaults? Custom materials will be removed.')){ try{localStorage.removeItem('fermi.materials');}catch(e){} mats=loadMats(); renderMaterials(); renderLayers(); recompute(); } });
  // tabs
  $$('.pane-tabs').forEach(tabs=>{ tabs.addEventListener('click', e=>{ const b=e.target.closest('[data-tab]'); if (!b) return; $$('[data-tab]',tabs).forEach(x=>x.setAttribute('aria-selected', x===b?'true':'false')); const pane=tabs.parentElement; $$('.pane-body',pane).forEach(x=>x.hidden = x.id!=='tab-'+b.dataset.tab); }); });
  $('#figSeg').addEventListener('click', e=>{ const b=e.target.closest('[data-fig]'); if (!b) return; currentFig=b.dataset.fig; $$('[data-fig]').forEach(x=>x.setAttribute('aria-pressed', x===b?'true':'false')); view.auto=true; recompute(); syncPanel($('#tab-figure')); const cb=$('#captionBox'); if (cb) cb.value=captionText(); });
  $$('.mobile-nav button').forEach(b=>b.addEventListener('click', ()=>{ $$('.mobile-nav button').forEach(x=>x.setAttribute('aria-pressed', x===b?'true':'false')); ['paneLeft','paneCenter','paneRight'].forEach(id=>$('#'+id).dataset.active = (id===b.dataset.pane)?'true':'false'); if (b.dataset.pane==='paneCenter') setTimeout(renderPreview,30); }));
  // 3D view: drag to rotate
  const pv=$('#preview'); let drag=null;
  const clamp=(v,a,b)=>Math.max(a, Math.min(b, v));
  pv.addEventListener('pointerdown', e=>{ if (e.button!==0 || currentFig!=='d3' || e.target.closest('.navbtn,.figbar')) return;
    drag={x:e.clientX, y:e.clientY, az:+state.xs.d3Az||0, el:+state.xs.d3El||26, prev:snapshot(), moved:false}; pv.setPointerCapture(e.pointerId); });
  pv.addEventListener('pointermove', e=>{ if (!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if (Math.abs(dx)+Math.abs(dy)<2 && !drag.moved) return; drag.moved=true;
    state.xs.d3Az=Math.round(clamp(drag.az+dx*0.4, -80, 80)); state.xs.d3El=Math.round(clamp(drag.el+dy*0.3, 8, 80)); renderPreview(); });
  const endDrag=()=>{ if (drag && drag.moved){ commit({prev:drag.prev}); syncPanel($('#tab-figure')); } drag=null; };
  pv.addEventListener('pointerup', endDrag); pv.addEventListener('pointercancel', endDrag);
  $('#figPrev').addEventListener('click', ()=>showFig(-1, true)); $('#figNext').addEventListener('click', ()=>showFig(1, true));
  $('#figBar').addEventListener('click', e=>{ const b=e.target.closest('[data-go]'); if (b) showFig(+b.dataset.go, false); });
  // theme
  const applyTheme=t=>{ if (t) document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme'); };
  // NSDG edition: the interface follows the light or dark theme chosen on the group website
  // (stored by the site as 'nsdg-mode'), and changes at once when that is switched.
  const siteTheme=()=>{ try{ return localStorage.getItem('nsdg-mode')==='dark' ? 'dark' : 'light'; }catch(e){ return 'light'; } };
  applyTheme(siteTheme());
  window.addEventListener('storage', e=>{ if (e.key==='nsdg-mode' || e.key===null) applyTheme(siteTheme()); });
  $('#themeBtn').style.display='none';
  // help
  const openHelp=(html)=>{ $('#helpBox').innerHTML=html; $('#helpModal').setAttribute('open',''); $('#helpBox').scrollTop=0; $('#helpClose').focus(); };
  $('#helpBtn').addEventListener('click', ()=>openHelp(helpHTML())); $('#guideBtn').addEventListener('click', ()=>openHelp(guideHTML()));
  $('#helpModal').addEventListener('click', e=>{ if (e.target.id==='helpModal' || e.target.id==='helpClose') $('#helpModal').removeAttribute('open'); });
  const psel=$('#profSel'); psel.innerHTML=PROFILE_Q.map((q,i)=>`<option value="${i}">${esc(q[1])}</option>`).join(''); psel.addEventListener('change', ()=>{ showFig(+psel.value, false); const cb=$('#captionBox'); if (cb) cb.value=captionText(); });
  // keys
  document.addEventListener('keydown', e=>{ const mod=e.ctrlKey||e.metaKey; const tag=(e.target.tagName||'').toLowerCase(); const typing = tag==='input'||tag==='textarea'||tag==='select';
    if (mod && e.key.toLowerCase()==='z'){ if (typing && tag!=='select') return; e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
    if (mod && e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }
    if (e.altKey && (e.key==='ArrowUp'||e.key==='ArrowDown') && selectedLayer){ e.preventDefault(); const i=state.stack.layers.findIndex(l=>l.id===selectedLayer); if (i>=0) moveLayer(i, e.key==='ArrowUp'?-1:1); return; }
    if (!typing && !mod && !e.altKey && (e.key==='ArrowLeft'||e.key==='ArrowRight') && shownFigs.length>1){ e.preventDefault(); showFig(e.key==='ArrowLeft'?-1:1, true); return; }
    if (e.key==='Escape') $('#helpModal').removeAttribute('open'); });
  window.addEventListener('resize', ()=>{ clearTimeout(window._rz); window._rz=setTimeout(renderPreview,120); });
  renderFigurePanel(); renderExportPanel(); recompute(); renderLayers(); renderMaterials(); updateUndo();
  loadLicense();   // async: re-verifies a stored key offline and unlocks Pro when it is genuine and unexpired
  $('#templateSel').value = state.template||'';
  setTimeout(renderPreview, 50);
}
document.addEventListener('DOMContentLoaded', init);
</script>
