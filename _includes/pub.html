{% assign p = include.p %}
<li class="pub">
  <span class="pub-title">{% if p.doi %}<a href="https://doi.org/{{ p.doi }}">{{ p.title }}</a>{% else %}{{ p.title }}{% endif %}</span>
  <span class="pub-authors">{{ p.authors }}</span>
  <span class="pub-venue"><em>{{ p.venue }}</em>{% if p.details %} {{ p.details }}{% endif %} ({{ p.year }}){% if p.note %} <span class="badge">{{ p.note }}</span>{% endif %}{% if p.doi %}<span class="doi"> · <a href="https://doi.org/{{ p.doi }}">doi:{{ p.doi }}</a></span>{% endif %}</span>
  <span class="pub-actions" data-type="{{ p.type }}" data-authors="{{ p.authors | escape }}" data-title="{{ p.title | escape }}" data-venue="{{ p.venue | escape }}" data-details="{{ p.details | escape }}" data-year="{{ p.year }}" data-doi="{{ p.doi }}"><button type="button" class="cite-btn" data-kind="text">Copy citation</button><button type="button" class="cite-btn" data-kind="bibtex">BibTeX</button></span>
</li>
