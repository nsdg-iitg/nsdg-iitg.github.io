{% assign g = include.g %}{% if include.feature %}{% assign thumb = "" %}{% else %}{% assign thumb = "thumbs/" %}{% endif %}
<figure class="g-item{% if include.feature %} g-feature{% endif %}">
  <a href="{{ '/assets/img/gallery/' | append: g.src | relative_url }}"><img src="{{ '/assets/img/gallery/' | append: thumb | append: g.src | relative_url }}" alt="{{ g.caption | default: 'Group photo' }}" loading="lazy"></a>
  {% if g.caption %}<figcaption><span>{{ g.caption }}</span></figcaption>{% endif %}
</figure>
