<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script>try{if(localStorage.getItem("nsdg-mode")==="dark")document.documentElement.setAttribute("data-mode","dark")}catch(e){}</script>
<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/scrollcraft/scrollcraft.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/v2.css' | relative_url }}">
<noscript><style>[data-sc-in],[data-sc-stagger]>*,[data-sc-cue]{opacity:1!important;transform:none!important}[data-sc-reveal]{clip-path:none!important}</style></noscript>
<link rel="alternate" type="application/atom+xml" title="{{ site.group_name }}: News" href="{{ '/feed.xml' | relative_url }}">
{% if page.noindex %}<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
{% endif %}{% if site.goatcounter and site.goatcounter != "" and page.noindex != true %}<script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>{% endif %}
{% seo %}
