# Newest first. type: paper marks a paper announcement; these are left out of the home-page news, which already lists recent papers. date: YYYY-MM-DD. If the day is not known use 01; the site then shows only the month. link is optional.
- date: 2026-11-16
  title: "Talk by Prof. Subramanian Iyer (UCLA) on advanced packaging"
  text: "Prof. Subu Iyer, Distinguished Professor at UCLA and former Director of the US National Advanced Packaging Manufacturing Program, spoke at the Department of EEE on “What is next in ‘Advanced’ Packaging?”. The talk covered scale-down and scale-out of packages, and how dense chip-to-chip connection can reduce power in datacentres."

