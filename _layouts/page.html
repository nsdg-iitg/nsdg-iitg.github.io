---
layout: default
---
<section class="page-head">
  <div class="wrap">
    {% if page.kicker %}<p class="kicker">{{ page.kicker }}</p>{% endif %}
    <h1>{% if page.logo %}{% include tool-logo.html name=page.logo %}{% endif %}{{ page.heading | default: page.title }}</h1>
    {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  </div>
</section>
<div class="wrap page-body">
{{ content }}
</div>
